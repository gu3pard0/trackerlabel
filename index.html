// Agrupa las publicaciones de un artista en "etapas": cada álbum con sus
// singles/EP enlazados (parentReleaseId), más un grupo de sueltos sin álbum.
function groupIntoEras(ownReleases) {
  const albums = ownReleases.filter((r) => r.type === "Álbum").sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
  const eras = albums.map((album) => ({
    album,
    singles: ownReleases.filter((r) => r.parentReleaseId === album.id).sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate)),
  }));
  const standalone = ownReleases
    .filter((r) => r.type !== "Álbum" && !r.parentReleaseId)
    .sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
  return { eras, standalone };
}

function ArtistDetail({ artist, releases, snapshots, tours, merch, releaseFinance, notes, notesCrud, appToday, onBack, onOpenRelease }) {
  if (!artist) return <EmptyState text="Este artista ya no existe." />;
  const ownReleases = releases.filter((r) => r.artistId === artist.id);
  const ownTours = tours.filter((t) => t.artistId === artist.id).sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
  const ownMerch = merch.filter((m) => m.artistId === artist.id);
  const ownNotes = notes.filter((n) => n.artistId === artist.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const { eras, standalone } = groupIntoEras(ownReleases);
  const initials = artist.name.split(" ").filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");

  // Ritmo de lanzamientos: cuánto tarda el artista entre lanzamiento y
  // lanzamiento, solo entre álbumes, o entre ciclos completos (agrupando
  // cada álbum con sus singles, contando desde el primero de ese grupo que
  // saliera, sea el álbum o un single previo) — y cuánto lleva ya desde el
  // último hasta hoy.
  const [rhythmMode, setRhythmMode] = useState("all"); // "all" | "albums" | "cycles"
  const gapsBetween = (list) => {
    const gaps = [];
    for (let i = 1; i < list.length; i++) gaps.push(daysBetween(list[i - 1].releaseDate, list[i].releaseDate));
    return gaps;
  };
  const avgDays = (arr) => (arr.length === 0 ? null : Math.round(arr.reduce((s, x) => s + x, 0) / arr.length));

  const datedReleases = [...ownReleases].filter((r) => r.releaseDate).sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
  const datedAlbums = datedReleases.filter((r) => r.type === "Álbum");
  const cycleList = groupIntoEras(ownReleases)
    .eras.map(({ album, singles }) => {
      const cycleDate = [album.releaseDate, ...singles.map((s) => s.releaseDate)].filter(Boolean).sort()[0];
      return { id: album.id, title: album.title, coverUrl: album.coverUrl, type: "Álbum", releaseDate: cycleDate };
    })
    .filter((c) => c.releaseDate)
    .sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));

  const rhythmSource = rhythmMode === "albums" ? datedAlbums : rhythmMode === "cycles" ? cycleList : datedReleases;
  const rhythmGaps = gapsBetween(rhythmSource);
  const avgGap = avgDays(rhythmGaps);
  const lastItem = rhythmSource[rhythmSource.length - 1];
  const currentGap = lastItem ? daysBetween(lastItem.releaseDate, appToday) : null;
  const currentGapOverdue = currentGap !== null && avgGap !== null && currentGap > avgGap * 1.2;

  // Evolución del reconocimiento del artista por región: junta las semanas
  // de TODOS sus lanzamientos (no solo uno) en una única línea temporal,
  // para ver cómo ha ido creciendo desde su primer ciclo hasta hoy.
  const recognitionByRegion = useMemo(() => {
    const releaseById = {};
    ownReleases.forEach((r) => { releaseById[r.id] = r; });
    const byRegion = {};
    snapshots
      .filter((s) => releaseById[s.releaseId])
      .forEach((s) => {
        const rel = releaseById[s.releaseId];
        if (!rel.releaseDate) return;
        const date = addDaysISO(rel.releaseDate, (Number(s.week) || 0) * 7);
        const x = Math.floor(new Date(date + "T00:00:00").getTime() / 86400000);
        (s.regions || []).forEach((r) => {
          if (!r.code || r.recognitionPct === "" || r.recognitionPct === undefined || r.recognitionPct === null) return;
          byRegion[r.code] = byRegion[r.code] || [];
          byRegion[r.code].push({ x, y: Number(r.recognitionPct) });
        });
      });
    return Object.keys(byRegion)
      .sort()
      .map((code, i) => ({ label: code, color: CHART_PALETTE[i % CHART_PALETTE.length], points: byRegion[code].sort((a, b) => a.x - b.x) }));
  }, [ownReleases, snapshots]);

  // Por cada ciclo (álbum + sus singles), cuánto reconocimiento había en la
  // primera semana registrada de esa etapa frente a la última, por región —
  // para ver de un vistazo cuánto ha subido sin tener que leer el gráfico.
  const cycleSummaries = useMemo(() => {
    const ascendingAlbums = [...eras].reverse();
    return ascendingAlbums
      .map((era, idx) => {
        const releaseIds = new Set([era.album.id, ...era.singles.map((s) => s.id)]);
        const relSnaps = snapshots
          .filter((s) => releaseIds.has(s.releaseId))
          .map((s) => {
            const rel = ownReleases.find((r) => r.id === s.releaseId);
            const date = rel && rel.releaseDate ? addDaysISO(rel.releaseDate, (Number(s.week) || 0) * 7) : null;
            return date ? { ...s, _date: date } : null;
          })
          .filter(Boolean);
        const byRegion = {};
        relSnaps.forEach((s) => {
          (s.regions || []).forEach((r) => {
            if (!r.code || r.recognitionPct === "" || r.recognitionPct === undefined || r.recognitionPct === null) return;
            byRegion[r.code] = byRegion[r.code] || [];
            byRegion[r.code].push({ date: s._date, week: s.week, pct: Number(r.recognitionPct) });
          });
        });
        const regionRows = Object.keys(byRegion)
          .sort()
          .map((code) => {
            const pts = byRegion[code].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
            const first = pts[0], last = pts[pts.length - 1];
            return { code, first, last, delta: last.pct - first.pct };
          });
        return { album: era.album, cycleNumber: idx + 1, regionRows };
      })
      .filter((c) => c.regionRows.length > 0);
  }, [eras, snapshots, ownReleases]);

  const [noteDraft, setNoteDraft] = useState("");
  const addQuickNote = () => {
    if (!noteDraft.trim()) return;
    notesCrud.add({ title: "", body: noteDraft.trim(), artistId: artist.id });
    setNoteDraft("");
  };
  const removeNote = (id) => notesCrud.remove(id);

  return (
    <div className="ltk-panel-stack">
      <button className="ltk-back-link" onClick={onBack}>← Volver a artistas</button>
      <div className="ltk-detail-hero">
        <div className="ltk-detail-avatar">{initials || "?"}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h1 style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 700, margin: "0 0 4px" }}>{artist.name}</h1>
          <div className="ltk-muted">{artist.genre || "Sin género"} · Fichado el {fmtDate(artist.signedDate)}</div>
        </div>
        <span className={`ltk-tag ${artist.status === "Retirado" ? "" : "ltk-tag-success"}`}>{artist.status || "Activo"}</span>
      </div>

      <div className="ltk-stat-row">
        <StatCard label="Copias vendidas" value={fmtNum(artist.copies)} accent />
        <StatCard label="Ingresos totales" value={fmtMoney(artist.revenue)} />
        <StatCard label="Beneficio lanzamientos" value={fmtMoney(artist.releaseProfit)} sub={`${fmtMoney(artist.releaseRevenue)} ingresos − ${fmtMoney(artist.releaseCosts)} costes`} />
        <StatCard label="Beneficio total" value={fmtMoney(artist.profit)} sub="lanzamientos + giras" />
        <StatCard label="Lanzamientos" value={ownReleases.length} sub={`${eras.length} álbum(es), ${standalone.length} suelto(s)`} />
        <StatCard label="Giras" value={ownTours.length} sub={`${fmtMoney(artist.tourRevenue)} ingr. − ${fmtMoney(artist.tourCosts)} costes`} />
        <StatCard label="Merch" value={ownMerch.length} sub={fmtMoney(ownMerch.reduce((s, m) => s + (Number(m.revenue) || 0), 0))} />
      </div>

      <section className="ltk-card">
        <h2>Ritmo de lanzamientos</h2>
        <div className="ltk-channels" style={{ flexDirection: "row", gap: 8, marginBottom: 14 }}>
          <button className={`ltk-btn-ghost ${rhythmMode === "all" ? "is-active" : ""}`} onClick={() => setRhythmMode("all")}>Todos</button>
          <button className={`ltk-btn-ghost ${rhythmMode === "albums" ? "is-active" : ""}`} onClick={() => setRhythmMode("albums")}>Álbumes</button>
          <button className={`ltk-btn-ghost ${rhythmMode === "cycles" ? "is-active" : ""}`} onClick={() => setRhythmMode("cycles")}>Ciclos</button>
        </div>
        {rhythmSource.length < 2 ? (
          <EmptyState text={`Hacen falta al menos 2 ${rhythmMode === "albums" ? "álbumes" : rhythmMode === "cycles" ? "ciclos" : "lanzamientos"} con fecha para calcular el ritmo.`} />
        ) : (
          <React.Fragment>
            <div className="ltk-stat-row" style={{ marginBottom: 16 }}>
              <StatCard
                label={rhythmMode === "albums" ? "Media entre álbumes" : rhythmMode === "cycles" ? "Media entre ciclos" : "Media entre lanzamientos"}
                value={formatGap(avgGap)} sub={`sobre ${rhythmGaps.length} intervalo(s)`}
              />
              <StatCard
                label="Lleva ahora mismo" value={formatGap(currentGap)}
                sub={`desde «${lastItem.title}» (${fmtDate(lastItem.releaseDate)}) hasta hoy`}
                accent={!currentGapOverdue}
              />
            </div>
            <div className="ltk-release-timeline">
              {rhythmSource.map((r, i) => (
                <React.Fragment key={r.id}>
                  {i > 0 && <div className="ltk-release-gap">{formatGap(rhythmGaps[i - 1])}</div>}
                  <button className={`ltk-release-timeline-item ${r.type === "Álbum" ? "is-album" : ""}`} onClick={() => onOpenRelease(r.id)}>
                    {r.coverUrl ? <img className="ltk-cover-thumb" src={r.coverUrl} alt="" /> : <div className="ltk-cover-placeholder" />}
                    <div className="ltk-release-timeline-title">{r.title}</div>
                    <div className="ltk-muted" style={{ fontSize: 10.5 }}>{fmtDate(r.releaseDate)}</div>
                    <span className="ltk-tag" style={{ fontSize: 9.5 }}>{rhythmMode === "cycles" ? "Ciclo" : r.type}</span>
                  </button>
                </React.Fragment>
              ))}
              <div className={`ltk-release-gap ${currentGapOverdue ? "is-overdue" : ""}`}>{formatGap(currentGap)}</div>
              <div className="ltk-release-timeline-item is-today">
                <div className="ltk-cover-placeholder" style={{ display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: "var(--accent)" }}>HOY</div>
                <div className="ltk-release-timeline-title">{fmtDate(appToday)}</div>
                {currentGapOverdue && <span className="ltk-tag ltk-tag-danger" style={{ fontSize: 9.5 }}>por encima de su media</span>}
              </div>
            </div>
          </React.Fragment>
        )}
      </section>

      <section className="ltk-card">
        <h2>Discografía</h2>
        {eras.length === 0 && standalone.length === 0 ? <EmptyState text="Sin lanzamientos todavía." /> : (
          <div className="ltk-panel-stack" style={{ gap: 12 }}>
            {eras.map(({ album, singles }) => {
              const eraTours = ownTours.filter((t) => t.albumId === album.id);
              const eraMerch = ownMerch.filter((m) => m.albumId === album.id);
              return (
                <div key={album.id} className="ltk-era-card">
                  <div className="ltk-era-head">
                    {album.coverUrl ? <img className="ltk-cover-thumb" src={album.coverUrl} alt="" /> : <div className="ltk-cover-placeholder" />}
                    <div className="ltk-era-head-info">
                      <button className="ltk-link" onClick={() => onOpenRelease(album.id)}>{album.title}</button>
                      <div className="ltk-muted">
                        {fmtDate(album.releaseDate)} · {fmtMoney(releaseFinance[album.id]?.revenue)}
                        {(eraTours.length > 0 || eraMerch.length > 0) && (
                          <> · {eraTours.length > 0 && `${eraTours.length} gira(s)`}{eraTours.length > 0 && eraMerch.length > 0 && " · "}{eraMerch.length > 0 && `${eraMerch.length} merch`}</>
                        )}
                      </div>
                    </div>
                    <span className="ltk-tag">Álbum</span>
                    {isAnniversaryReminderDue(album, releases, appToday) && <span className="ltk-tag ltk-tag-danger">🔔 ¡10 años! Apta para aniversario</span>}
                  </div>
                  {singles.length > 0 && (
                    <ul className="ltk-singles-list">
                      {singles.map((s) => (
                        <li key={s.id} className="ltk-single-row">
                          {s.coverUrl ? <img className="ltk-cover-thumb" src={s.coverUrl} alt="" /> : <div className="ltk-cover-placeholder" />}
                          <button className="ltk-link ltk-single-row-title" onClick={() => onOpenRelease(s.id)}>{s.title} <span className="ltk-tag">{s.type}</span></button>
                          <span className="ltk-single-row-figures">{fmtMoney(releaseFinance[s.id]?.revenue)}</span>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              );
            })}
            {standalone.length > 0 && (
              <div className="ltk-era-card">
                <div className="ltk-muted" style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em" }}>Sueltos (sin álbum)</div>
                <ul className="ltk-singles-list" style={{ borderTop: "none", paddingTop: 0 }}>
                  {standalone.map((s) => (
                    <li key={s.id} className="ltk-single-row">
                      {s.coverUrl ? <img className="ltk-cover-thumb" src={s.coverUrl} alt="" /> : <div className="ltk-cover-placeholder" />}
                      <button className="ltk-link ltk-single-row-title" onClick={() => onOpenRelease(s.id)}>{s.title} <span className="ltk-tag">{s.type}</span></button>
                      <span className="ltk-single-row-figures">{fmtDate(s.releaseDate)} · {fmtMoney(releaseFinance[s.id]?.revenue)}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>
        )}
      </section>

      <section className="ltk-card">
        <h2>Giras</h2>
        {ownTours.length === 0 ? <EmptyState text="Sin giras registradas." /> : (
          <div className="ltk-table-wrap">
            <table className="ltk-table">
              <thead><tr><th>Gira</th><th>Estado</th><th>Fechas</th><th>Entradas</th><th>Ingresos</th><th>Álbum</th></tr></thead>
              <tbody>
                {ownTours.map((t) => {
                  const linkedAlbum = t.albumId ? releases.find((r) => r.id === t.albumId) : null;
                  return (
                    <tr key={t.id}>
                      <td className="ltk-strong">{t.tourName}</td>
                      <td><span className="ltk-tag">{t.status}</span></td>
                      <td>{fmtDate(t.startDate)} — {fmtDate(t.endDate)}</td>
                      <td>{fmtNum(t.ticketsSold)} / {fmtNum(t.ticketsAvailable)}</td>
                      <td>{fmtMoney(t.revenue)}</td>
                      <td>{linkedAlbum ? <button className="ltk-link" onClick={() => onOpenRelease(linkedAlbum.id)}>{linkedAlbum.title}</button> : <span className="ltk-muted">—</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </section>

      <section className="ltk-card">
        <h2>Merch</h2>
        {ownMerch.length === 0 ? <EmptyState text="Sin productos de merch registrados." /> : (
          <div className="ltk-table-wrap">
            <table className="ltk-table">
              <thead><tr><th>Producto</th><th>Unidades</th><th>Ingresos</th><th>Nota</th><th>Álbum</th></tr></thead>
              <tbody>
                {ownMerch.map((m) => {
                  const linkedAlbum = m.albumId ? releases.find((r) => r.id === m.albumId) : null;
                  return (
                    <tr key={m.id}>
                      <td className="ltk-strong">{m.product}</td>
                      <td>{fmtNum(m.unitsSold)}</td>
                      <td>{fmtMoney(m.revenue)}</td>
                      <td className="ltk-muted">{m.note || "—"}</td>
                      <td>{linkedAlbum ? <button className="ltk-link" onClick={() => onOpenRelease(linkedAlbum.id)}>{linkedAlbum.title}</button> : <span className="ltk-muted">—</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </section>

      <section className="ltk-card">
        <h2>Evolución del reconocimiento</h2>
        {recognitionByRegion.length === 0 ? (
          <EmptyState text="Añade el desglose por región en el seguimiento semanal de sus lanzamientos para ver aquí cómo ha crecido su reconocimiento ciclo a ciclo." />
        ) : (
          <MiniLineChart series={recognitionByRegion} xFormat={(x) => fmtDate(new Date(x * 86400000).toISOString().slice(0, 10))} yFormat={(y) => `${y}%`} />
        )}
      </section>

      <section className="ltk-card">
        <h2>Reconocimiento por ciclo</h2>
        {cycleSummaries.length === 0 ? (
          <EmptyState text="Añade el desglose por región en el seguimiento semanal para ver aquí cuánto ha subido el reconocimiento en cada ciclo, de la primera a la última semana registrada." />
        ) : (
          <div className="ltk-panel-stack" style={{ gap: 14 }}>
            {cycleSummaries.map((c) => (
              <div key={c.album.id} className="ltk-era-card">
                <button className="ltk-link" onClick={() => onOpenRelease(c.album.id)}>Ciclo {c.cycleNumber} — {c.album.title}</button>
                <div className="ltk-table-wrap" style={{ marginTop: 8 }}>
                  <table className="ltk-table">
                    <thead><tr><th>Región</th><th>Inicio</th><th>Última semana</th><th>Variación</th></tr></thead>
                    <tbody>
                      {c.regionRows.map((r) => (
                        <tr key={r.code}>
                          <td className="ltk-strong">{r.code}</td>
                          <td>{r.first.pct}% <span className="ltk-muted">(sem {r.first.week})</span></td>
                          <td>{r.last.pct}% <span className="ltk-muted">(sem {r.last.week})</span></td>
                          <td style={{ color: r.delta > 0 ? "var(--success)" : r.delta < 0 ? "var(--danger)" : "var(--text-muted)" }}>
                            {r.delta > 0 ? "+" : ""}{r.delta.toFixed(1)}pp
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ))}
          </div>
        )}
      </section>

      <section className="ltk-card">
        <h2>Notas</h2>
        <div className="ltk-form" style={{ marginBottom: 14 }}>
          <div className="ltk-field ltk-field-wide">
            <label>Nueva nota rápida</label>
            <input value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)} placeholder="Escribe algo sobre este artista…" onKeyDown={(e) => { if (e.key === "Enter") addQuickNote(); }} />
          </div>
          <button className="ltk-btn" type="button" onClick={addQuickNote}>Añadir</button>
        </div>
        {ownNotes.length === 0 ? <EmptyState text="Sin notas todavía." /> : (
          <ul className="ltk-list">
            {ownNotes.map((n) => (
              <li key={n.id} className="ltk-list-row">
                <div className="ltk-list-main">
                  <span style={{ whiteSpace: "pre-wrap" }}>{n.title ? <React.Fragment><strong>{n.title}: </strong>{n.body}</React.Fragment> : n.body}</span>
                  <button className="ltk-btn-icon is-danger" onClick={() => removeNote(n.id)} title="Eliminar">✕</button>
                </div>
              </li>
            ))}
          </ul>
        )}
      </section>
    </div>
  );
}

// Ficha de UN lanzamiento (álbum, single o EP): aquí es donde se ajustan
// las ventas semana a semana, se ven los gráficos de evolución y — si es
// un álbum — sus singles enlazados y las giras/merch de esa etapa.
function ReleaseDetail({ release, releases, snapshots, snapshotsCrud, tours, merch, releaseFinance, artists, artistName, appToday, onBack, onOpenRelease }) {
  if (!release) return <EmptyState text="Este lanzamiento ya no existe." />;
  const isAlbum = release.type === "Álbum";
  const parentAlbum = release.parentReleaseId ? releases.find((r) => r.id === release.parentReleaseId) : null;
  const singles = isAlbum ? releases.filter((r) => r.parentReleaseId === release.id).sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate)) : [];
  const releaseSnapshots = [...snapshots].filter((s) => s.releaseId === release.id).sort((a, b) => Number(a.week) - Number(b.week));
  const linkedTours = isAlbum ? tours.filter((t) => t.albumId === release.id) : [];
  const linkedMerch = isAlbum ? merch.filter((m) => m.albumId === release.id) : [];

  const artist = artists.find((a) => a.id === release.artistId);
  const artistAlbums = releases.filter((r) => r.artistId === release.artistId && r.type === "Álbum").sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate));
  const cycleNumber = artistAlbums.findIndex((a) => a.id === release.id) + 1;
  const [showExport, setShowExport] = useState(false);
  const [exportText, setExportText] = useState("");
  const [copyStatus, setCopyStatus] = useState("");
  const openExport = () => {
    setExportText(buildCycleExportText(release, singles, snapshots, artist, cycleNumber));
    setCopyStatus("");
    setShowExport(true);
  };
  const doCopy = async () => {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopyStatus("Copiado ✓");
    } catch (e) {
      setCopyStatus("No se pudo copiar automáticamente — selecciona el texto y copia con Ctrl+C.");
    }
  };

  // el single "promo" (3ª posición entre los singles de su álbum, misma
  // convención que ya usa singleLabel) siempre arranca en la semana 3 en
  // vez de la 4 — a partir de ahí, todo sigue sumando de 4 en 4 como siempre
  const siblingSingles = parentAlbum ? releases.filter((r) => r.parentReleaseId === parentAlbum.id).sort((a, b) => new Date(a.releaseDate) - new Date(b.releaseDate)) : [];
  const isPromoSingle = parentAlbum && siblingSingles.findIndex((s) => s.id === release.id) === 2;
  const firstWeekDefault = isPromoSingle ? "3" : "4";

  const blankSnap = { releaseId: release.id, week: firstWeekDefault, copies: "", revenue: "", costs: "", peakGlobal: "", regions: [] };
  // el single promo salta directamente de la semana 23 a la 28 (se salta la
  // 27, que le tocaría por el +4 normal) — el resto sigue como siempre
  const nextWeekFor = (currentWeek) => {
    const computed = Number(currentWeek) + 4;
    return isPromoSingle && computed === 27 ? 28 : computed;
  };
  const autofillSnap = () => {
    const latest = releaseSnapshots[releaseSnapshots.length - 1];
    if (!latest) return blankSnap;
    return {
      releaseId: release.id,
      week: latest.week !== null && latest.week !== undefined && latest.week !== "" ? String(nextWeekFor(latest.week)) : "",
      copies: latest.copies ?? "", revenue: latest.revenue ?? "", costs: latest.costs ?? "", peakGlobal: latest.peakGlobal || "",
      regions: (latest.regions || []).map((r) => ({ ...r })),
    };
  };
  const [snapForm, setSnapForm] = useState(autofillSnap);
  const [editingSnapId, setEditingSnapId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [showScanner, setShowScanner] = useState(false);
  const [snapSource, setSnapSource] = useState(null); // null | "scan"
  const [snapJustSaved, setSnapJustSaved] = useState(null);
  const [snapSubmitting, setSnapSubmitting] = useState(false);
  useEffect(() => { setSnapForm(autofillSnap()); setEditingSnapId(null); setShowForm(false); setShowScanner(false); setSnapSource(null); setSnapJustSaved(null); }, [release.id]);

  const addRegionRow = () => setSnapForm((f) => ({ ...f, regions: [...f.regions, { code: "", recognitionPct: "", copies: "", peak: "", revenue: "" }] }));
  const updateRegionRow = (idx, field, value) => setSnapForm((f) => ({ ...f, regions: f.regions.map((r, i) => (i === idx ? { ...r, [field]: value } : r)) }));
  const removeRegionRow = (idx) => setSnapForm((f) => ({ ...f, regions: f.regions.filter((_, i) => i !== idx) }));

  const submitSnap = (e) => {
    e.preventDefault();
    if (snapForm.week === "" || snapSubmitting) return;
    const savedWeek = snapForm.week;
    setSnapSubmitting(true);
    if (editingSnapId) {
      snapshotsCrud.update(editingSnapId, snapForm);
      setSnapForm(autofillSnap());
    } else {
      snapshotsCrud.add(snapForm);
      setSnapForm({ releaseId: release.id, week: String(nextWeekFor(snapForm.week)), copies: snapForm.copies, revenue: snapForm.revenue, costs: snapForm.costs, peakGlobal: snapForm.peakGlobal, regions: snapForm.regions.map((r) => ({ ...r })) });
    }
    setEditingSnapId(null);
    setSnapSource(null);
    setSnapJustSaved(savedWeek);
    setTimeout(() => setSnapSubmitting(false), 1000);
    setTimeout(() => setSnapJustSaved(null), 2800);
  };
  const startEditSnap = (s) => { setSnapForm({ ...s, regions: (s.regions || []).map((r) => ({ ...r })) }); setEditingSnapId(s.id); setSnapSource(null); setShowForm(true); };
  const cancelEditSnap = () => { setSnapForm(autofillSnap()); setEditingSnapId(null); setSnapSource(null); };
  const closeForm = () => { cancelEditSnap(); setShowForm(false); };
  const removeSnap = (id) => { snapshotsCrud.remove(id); if (editingSnapId === id) cancelEditSnap(); };
  const handleScanExtracted = (data) => {
    const latest = releaseSnapshots[releaseSnapshots.length - 1];
    // La semana leída por OCR no es fiable (el texto de duración varía
    // mucho entre capturas), así que se ignora y se usa el mismo sistema
    // de siempre: última semana registrada + 4, o 4 si es la primera.
    const week = latest && latest.week !== null && latest.week !== undefined && latest.week !== "" ? String(Number(latest.week) + 4) : "4";
    setSnapForm({ releaseId: release.id, ...data, week });
    setEditingSnapId(null);
    setSnapSource("scan");
    setShowForm(true);
  };

  const copiesSeries = [{ label: "Copias", color: CHART_PALETTE[0], points: releaseSnapshots.filter((s) => s.copies !== null && s.copies !== undefined).map((s) => ({ x: Number(s.week), y: Number(s.copies) })) }];
  const moneySeries = [
    { label: "Ingresos", color: CHART_PALETTE[1], points: releaseSnapshots.filter((s) => s.revenue !== null && s.revenue !== undefined).map((s) => ({ x: Number(s.week), y: Number(s.revenue) })) },
    { label: "Costes", color: CHART_PALETTE[2], points: releaseSnapshots.filter((s) => s.costs !== null && s.costs !== undefined).map((s) => ({ x: Number(s.week), y: Number(s.costs) })) },
  ];
  const regionCodes = [...new Set(releaseSnapshots.flatMap((s) => (s.regions || []).map((r) => r.code).filter(Boolean)))];
  const regionSeries = regionCodes.map((code, i) => ({
    label: code, color: CHART_PALETTE[(i + 3) % CHART_PALETTE.length],
    points: releaseSnapshots.filter((s) => (s.regions || []).some((r) => r.code === code && r.recognitionPct !== ""))
      .map((s) => ({ x: Number(s.week), y: Number((s.regions.find((r) => r.code === code) || {}).recognitionPct) || 0 })),
  }));

  return (
    <div className="ltk-panel-stack">
      <button className="ltk-back-link" onClick={onBack}>← Volver a {artistName(release.artistId)}</button>
      <div className="ltk-detail-hero">
        {release.coverUrl ? <img className="ltk-detail-cover" src={release.coverUrl} alt="" /> : <div className="ltk-detail-cover-placeholder" />}
        <div style={{ flex: 1, minWidth: 0 }}>
          <h1 style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700, margin: "0 0 4px" }}>{release.title}</h1>
          <div className="ltk-muted">
            {artistName(release.artistId)} · {fmtDate(release.releaseDate)}
            {parentAlbum && <> · Álbum: <button className="ltk-link" onClick={() => onOpenRelease(parentAlbum.id)}>{parentAlbum.title}</button></>}
          </div>
        </div>
        <span className="ltk-tag">{release.type}</span>
        {isAnniversaryReminderDue(release, releases, appToday) && <span className="ltk-tag ltk-tag-danger">🔔 ¡10 años! Apta para edición aniversario</span>}
        <span className="ltk-tag">{release.status}</span>
        {isAlbum && <button className="ltk-btn-ghost" onClick={openExport}>📋 Copiar ciclo</button>}
      </div>

      {isAlbum && showExport && (
        <section className="ltk-card">
          <div className="ltk-subhead">
            <h2>Copiar ciclo {cycleNumber} como texto</h2>
            <button className="ltk-btn-icon" onClick={() => setShowExport(false)} title="Cerrar">✕</button>
          </div>
          {exportText ? (
            <div className="ltk-panel-stack" style={{ gap: 10, marginTop: 10 }}>
              <p className="ltk-muted" style={{ margin: 0 }}>Reconstruido a partir de la última semana registrada de cada single (y el promo, si existe) y del álbum. Revísalo antes de copiar — puedes editarlo aquí mismo.</p>
              <textarea
                value={exportText}
                onChange={(e) => setExportText(e.target.value)}
                rows={Math.min(16, exportText.split("\n").length + 1)}
                style={{ background: "var(--panel-alt)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: 6, padding: "10px 12px", fontFamily: "var(--font-mono)", fontSize: 12.5, resize: "vertical" }}
              />
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button className="ltk-btn" type="button" onClick={doCopy}>Copiar al portapapeles</button>
                {copyStatus && <span className="ltk-muted">{copyStatus}</span>}
              </div>
            </div>
          ) : (
            <EmptyState text="Ninguno de los lanzamientos de este ciclo tiene semanas registradas todavía." />
          )}
        </section>
      )}

      <div className="ltk-stat-row">
        <StatCard label="Copias (últ.)" value={fmtNum(releaseFinance[release.id]?.copies)} accent />
        <StatCard label="Ingresos (últ.)" value={fmtMoney(releaseFinance[release.id]?.revenue)} />
        <StatCard label="Costes (últ.)" value={fmtMoney(releaseFinance[release.id]?.costs)} />
        <StatCard label={isAlbum ? "Singles del álbum" : "Semanas registradas"} value={isAlbum ? singles.length : releaseSnapshots.length} />
        <StatCard label="Última semana" value={releaseSnapshots.length ? releaseSnapshots[releaseSnapshots.length - 1].week : "—"} />
      </div>

      {isAlbum && <EraImportPanel album={release} singles={singles} snapshotsCrud={snapshotsCrud} />}

      <section className="ltk-card">
        <div className="ltk-subhead">
          <h2>{editingSnapId ? "Editar actualización" : "Registrar semana"}</h2>
          {!showForm && !showScanner && (
            <div style={{ display: "flex", gap: 6 }}>
              <button className="ltk-btn-icon" onClick={() => setShowScanner(true)} title="Escanear captura de pantalla">📷</button>
              <button className="ltk-btn-icon" onClick={() => setShowForm(true)} title="Registrar a mano">✎</button>
            </div>
          )}
        </div>
        {showScanner && <ScreenshotScanner onClose={() => setShowScanner(false)} onExtracted={handleScanExtracted} />}
        {showForm && (
          <form className={`ltk-form ${editingSnapId ? "ltk-form-editing" : ""}`} onSubmit={submitSnap} style={{ marginTop: 12 }}>
            {editingSnapId && <div className="ltk-editing-banner">Editando actualización de la semana {snapForm.week}</div>}
            {!editingSnapId && snapSource === "scan" && <div className="ltk-editing-banner">📷 Datos extraídos de una captura — revísalos antes de guardar</div>}
            {!editingSnapId && snapSource !== "scan" && releaseSnapshots.length > 0 && <div className="ltk-editing-banner">Autorrellenado con los datos de la semana {releaseSnapshots[releaseSnapshots.length - 1].week} — ajusta lo que haya cambiado</div>}
            {!editingSnapId && snapSource !== "scan" && releaseSnapshots.length === 0 && <div className="ltk-editing-banner">{isPromoSingle ? "Single promo: arranca en la semana 3" : "Primer registro: arranca en la semana 4"} — cámbialo si no coincide</div>}
            <div className="ltk-field"><label>Semana</label><input type="number" min="0" value={snapForm.week} onChange={(e) => setSnapForm({ ...snapForm, week: e.target.value })} placeholder="12" /></div>
            <div className="ltk-field"><label>Copias</label><input type="number" min="0" value={snapForm.copies} onChange={(e) => setSnapForm({ ...snapForm, copies: e.target.value })} placeholder="14700" /></div>
            <div className="ltk-field"><label>Ingresos (€)</label><input type="number" min="0" value={snapForm.revenue} onChange={(e) => setSnapForm({ ...snapForm, revenue: e.target.value })} placeholder="58800" /></div>
            <div className="ltk-field"><label>Costes (€)</label><input type="number" min="0" value={snapForm.costs} onChange={(e) => setSnapForm({ ...snapForm, costs: e.target.value })} placeholder="52100" /></div>
            <div className="ltk-field"><label>Pico global</label><input value={snapForm.peakGlobal} onChange={(e) => setSnapForm({ ...snapForm, peakGlobal: e.target.value })} placeholder="#12" /></div>
            <div className="ltk-region-rows">
              <label style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", color: "var(--text-muted)" }}>Desglose por región (opcional)</label>
              {snapForm.regions.map((r, idx) => (
                <div className="ltk-region-row" key={idx}>
                  <input placeholder="Región (NA, OC…)" value={r.code} onChange={(e) => updateRegionRow(idx, "code", e.target.value)} />
                  <input placeholder="Reconoc. %" value={r.recognitionPct} onChange={(e) => updateRegionRow(idx, "recognitionPct", e.target.value)} />
                  <input placeholder="Copias" value={r.copies} onChange={(e) => updateRegionRow(idx, "copies", e.target.value)} />
                  <input placeholder="Pico" value={r.peak} onChange={(e) => updateRegionRow(idx, "peak", e.target.value)} />
                  <input placeholder="Total €" value={r.revenue} onChange={(e) => updateRegionRow(idx, "revenue", e.target.value)} />
                  <button type="button" className="ltk-btn-icon is-danger" onClick={() => removeRegionRow(idx)} title="Quitar región">✕</button>
                </div>
              ))}
              <div><button type="button" className="ltk-btn-ghost" onClick={addRegionRow}>+ Añadir región</button></div>
            </div>
            <button className="ltk-btn" type="submit" disabled={snapSubmitting}>{editingSnapId ? "Guardar cambios" : "Registrar actualización"}</button>
            <button type="button" className="ltk-btn-ghost" onClick={closeForm}>{editingSnapId ? "Cancelar" : "Cerrar"}</button>
            {snapJustSaved && <span className="ltk-tag ltk-tag-success">✓ Semana {snapJustSaved} registrada</span>}
          </form>
        )}
      </section>

      <div className="ltk-grid-2">
        <section className="ltk-card">
          <h2>Copias por semana</h2>
          <MiniLineChart series={copiesSeries} yFormat={(y) => fmtNum(Math.round(y))} />
        </section>
        <section className="ltk-card">
          <h2>Ingresos y costes por semana</h2>
          <MiniLineChart series={moneySeries} yFormat={(y) => fmtMoney(y)} />
        </section>
      </div>

      <section className="ltk-card">
        <h2>Reconocimiento por región</h2>
        {regionSeries.length === 0 ? <EmptyState text="Añade regiones en el seguimiento semanal para ver su evolución aquí." /> : <MiniLineChart series={regionSeries} yFormat={(y) => `${y}%`} />}
      </section>

      <section className="ltk-card">
        <h2>Historial semanal</h2>
        {releaseSnapshots.length === 0 ? <EmptyState text="Sin actualizaciones de ventas todavía." /> : (
          <div className="ltk-table-wrap">
            <table className="ltk-table">
              <thead><tr><th>Semana</th><th>Copias</th><th>Ingresos</th><th>Costes</th><th>Pico global</th><th>Regiones</th><th /></tr></thead>
              <tbody>
                {releaseSnapshots.map((s) => (
                  <tr key={s.id} className={editingSnapId === s.id ? "is-editing" : ""}>
                    <td className="ltk-strong">{s.week}</td>
                    <td>{fmtNum(s.copies)}</td>
                    <td>{fmtMoney(s.revenue)}</td>
                    <td>{fmtMoney(s.costs)}</td>
                    <td>{s.peakGlobal || "—"}</td>
                    <td>{(s.regions || []).length === 0 ? "—" : s.regions.map((r, i) => (
                      <span key={i} className="ltk-tag" style={{ marginRight: 4 }}>{r.code || "?"} {fmtNum(r.copies)} (#{r.peak || "—"})</span>
                    ))}</td>
                    <td className="ltk-actions-cell">
                      <button className="ltk-btn-icon" onClick={() => startEditSnap(s)} title="Editar">✎</button>
                      <button className="ltk-btn-icon is-danger" onClick={() => removeSnap(s.id)} title="Eliminar">✕</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>

      {isAlbum && (
        <section className="ltk-card">
          <h2>Singles de esta etapa</h2>
          {singles.length === 0 ? <EmptyState text="Todavía no has enlazado ningún single a este álbum. Edítalo desde Lanzamientos y elige este álbum en 'Pertenece al álbum'." /> : (
            <div className="ltk-table-wrap">
              <table className="ltk-table">
                <thead><tr><th>Portada</th><th>Título</th><th>Tipo</th><th>Fecha</th><th>Ingresos (últ.)</th></tr></thead>
                <tbody>
                  {singles.map((s) => (
                    <tr key={s.id}>
                      <td>{s.coverUrl ? <img className="ltk-cover-thumb" src={s.coverUrl} alt="" /> : <div className="ltk-cover-placeholder" />}</td>
                      <td className="ltk-strong"><button className="ltk-link" onClick={() => onOpenRelease(s.id)}>{s.title}</button></td>
                      <td>{s.type}</td>
                      <td>{fmtDate(s.releaseDate)}</td>
                      <td>{fmtMoney(releaseFinance[s.id]?.revenue)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </section>
      )}

      {isAlbum && (linkedTours.length > 0 || linkedMerch.length > 0) && (
        <div className="ltk-grid-2">
          <section className="ltk-card">
            <h2>Giras de esta etapa</h2>
            {linkedTours.length === 0 ? <EmptyState text="Sin giras vinculadas." /> : (
              <ul className="ltk-list">
                {linkedTours.map((t) => (
                  <li key={t.id} className="ltk-list-row">
                    <div className="ltk-list-main"><span className="ltk-list-title">{t.tourName}</span><span className="ltk-tag">{t.status}</span></div>
                    <div className="ltk-muted">{fmtDate(t.startDate)} — {fmtDate(t.endDate)} · {fmtMoney(t.revenue)}</div>
                  </li>
                ))}
              </ul>
            )}
          </section>
          <section className="ltk-card">
            <h2>Merch de esta etapa</h2>
            {linkedMerch.length === 0 ? <EmptyState text="Sin merch vinculado." /> : (
              <ul className="ltk-list">
                {linkedMerch.map((m) => (
                  <li key={m.id} className="ltk-list-row">
                    <div className="ltk-list-main"><span className="ltk-list-title">{m.product}</span></div>
                    <div className="ltk-muted">{fmtNum(m.unitsSold)} uds · {fmtMoney(m.revenue)}</div>
                  </li>
                ))}
              </ul>
            )}
          </section>
        </div>
      )}
    </div>
  );
}

function RankRow({ position, cover, title, sub, primary, secondary, onClick }) {
  return (
    <div className="ltk-rank-row">
      <span className="ltk-rank-pos">#{position}</span>
      {cover !== undefined && (cover ? <img className="ltk-cover-thumb" src={cover} alt="" style={{ width: 32, height: 32 }} /> : <div className="ltk-cover-placeholder" style={{ width: 32, height: 32 }} />)}
      <div className="ltk-rank-info">
        <button className="ltk-link" onClick={onClick}>{title}</button>
        {sub && <div className="ltk-muted">{sub}</div>}
      </div>
      <div style={{ textAlign: "right" }}>
        <div className="ltk-rank-value">{primary}</div>
        <div className="ltk-muted">{secondary}</div>
      </div>
    </div>
  );
}

function RankingsTab({ artists, releases, releaseFinance, artistStats, artistName, onOpenArtist, onOpenRelease }) {
  const [mode, setMode] = useState("copies"); // "copies" | "money"
  const [filterArtistId, setFilterArtistId] = useState("");
  const byMode = (a, b) => (mode === "copies" ? b.copies - a.copies : b.revenue - a.revenue);
  const figures = (copies, revenue) =>
    mode === "copies"
      ? { primary: `${fmtNum(copies)} copias`, secondary: fmtMoney(revenue) }
      : { primary: fmtMoney(revenue), secondary: `${fmtNum(copies)} copias` };

  const scopedReleases = filterArtistId ? releases.filter((r) => r.artistId === filterArtistId) : releases;
  const withRevenue = scopedReleases.map((r) => ({ ...r, revenue: releaseFinance[r.id]?.revenue || 0, copies: releaseFinance[r.id]?.copies || 0 }));
  const topGlobal = [...withRevenue].sort(byMode).slice(0, 10);
  const topAlbums = withRevenue.filter((r) => r.type === "Álbum").sort(byMode).slice(0, 10);
  const topSingles = withRevenue.filter((r) => r.type !== "Álbum").sort(byMode).slice(0, 10);
  const topArtists = [...artistStats].sort(byMode).slice(0, 10);
  const topArtistsByProfit = [...artistStats].sort((a, b) => b.profit - a.profit).slice(0, 10);

  const byGenre = GENRES.map((genre) => {
    const own = artistStats.filter((a) => (a.genre || "") === genre);
    return {
      genre,
      artistCount: own.length,
      revenue: own.reduce((s, a) => s + a.revenue, 0),
      copies: own.reduce((s, a) => s + a.copies, 0),
      profit: own.reduce((s, a) => s + a.profit, 0),
    };
  })
    .filter((g) => g.artistCount > 0)
    .sort(byMode);
  const otherGenreArtists = artistStats.filter((a) => !GENRES.includes(a.genre || ""));
  if (otherGenreArtists.length > 0) {
    byGenre.push({
      genre: "Otro",
      artistCount: otherGenreArtists.length,
      revenue: otherGenreArtists.reduce((s, a) => s + a.revenue, 0),
      copies: otherGenreArtists.reduce((s, a) => s + a.copies, 0),
      profit: otherGenreArtists.reduce((s, a) => s + a.profit, 0),
    });
    byGenre.sort(byMode);
  }

  return (
    <div className="ltk-panel-stack">
      <header className="ltk-header"><h1>Rankings</h1><p>{filterArtistId ? `Comparando solo los lanzamientos de ${artistName(filterArtistId)}.` : "Top 10 según la última semana registrada de cada lanzamiento."}</p></header>
      <div className="ltk-filter-row">
        <div className="ltk-channels" style={{ flexDirection: "row", gap: 8 }}>
          <button className={`ltk-btn-ghost ${mode === "copies" ? "is-active" : ""}`} onClick={() => setMode("copies")}>Por copias</button>
          <button className={`ltk-btn-ghost ${mode === "money" ? "is-active" : ""}`} onClick={() => setMode("money")}>Por dinero</button>
        </div>
        <div className="ltk-field"><label>Filtrar por artista</label><ArtistSelect artists={artists} value={filterArtistId} onChange={setFilterArtistId} /></div>
        {filterArtistId && <button type="button" className="ltk-btn-ghost" onClick={() => setFilterArtistId("")}>Quitar filtro</button>}
      </div>
      <div className="ltk-grid-2">
        <section className="ltk-card">
          <h2>{filterArtistId ? "Sus lanzamientos (álbumes + singles)" : "Top 10 global (álbumes + singles)"}</h2>
          {topGlobal.length === 0 ? <EmptyState text="Sin datos todavía." /> : topGlobal.map((r, i) => (
            <RankRow key={r.id} position={i + 1} cover={r.coverUrl} title={r.title} sub={`${artistName(r.artistId)} · ${r.type}`} {...figures(r.copies, r.revenue)} onClick={() => onOpenRelease(r.id)} />
          ))}
        </section>
        <section className="ltk-card">
          <h2>{filterArtistId ? "Sus álbumes" : "Top 10 álbumes"}</h2>
          {topAlbums.length === 0 ? <EmptyState text="Sin álbumes todavía." /> : topAlbums.map((r, i) => (
            <RankRow key={r.id} position={i + 1} cover={r.coverUrl} title={r.title} sub={artistName(r.artistId)} {...figures(r.copies, r.revenue)} onClick={() => onOpenRelease(r.id)} />
          ))}
        </section>
        <section className="ltk-card">
          <h2>{filterArtistId ? "Sus singles / EP" : "Top 10 singles / EP"}</h2>
          {topSingles.length === 0 ? <EmptyState text="Sin singles todavía." /> : topSingles.map((r, i) => (
            <RankRow key={r.id} position={i + 1} cover={r.coverUrl} title={r.title} sub={`${artistName(r.artistId)} · ${r.type}`} {...figures(r.copies, r.revenue)} onClick={() => onOpenRelease(r.id)} />
          ))}
        </section>
        {!filterArtistId && (
        <section className="ltk-card">
          <h2>Top 10 artistas del sello</h2>
          {topArtists.length === 0 ? <EmptyState text="Sin artistas todavía." /> : topArtists.map((a, i) => (
            <RankRow key={a.id} position={i + 1} title={a.name} sub={a.genre || "Sin género"} {...figures(a.copies, a.revenue)} onClick={() => onOpenArtist(a.id)} />
          ))}
        </section>
        )}
      </div>

      {!filterArtistId && (
      <section className="ltk-card">
        <h2>Por género</h2>
        {byGenre.length === 0 ? <EmptyState text="Sin artistas todavía." /> : (
          <div className="ltk-table-wrap">
            <table className="ltk-table">
              <thead><tr><th>Género</th><th>Artistas</th><th>Copias</th><th>Ingresos</th><th>Beneficio</th></tr></thead>
              <tbody>
                {byGenre.map((g) => (
                  <tr key={g.genre}>
                    <td className="ltk-strong">{g.genre}</td>
                    <td>{g.artistCount}</td>
                    <td>{fmtNum(g.copies)}</td>
                    <td>{fmtMoney(g.revenue)}</td>
                    <td style={{ color: g.profit > 0 ? "var(--success)" : g.profit < 0 ? "var(--danger)" : "var(--text-muted)" }}>{fmtMoney(g.profit)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
      )}

      {!filterArtistId && (
      <section className="ltk-card">
        <h2>Artistas más rentables</h2>
        <p className="ltk-muted" style={{ marginTop: -6, marginBottom: 12 }}>Beneficio total: lanzamientos y giras (ingresos menos costes; no incluye merch).</p>
        {topArtistsByProfit.length === 0 ? <EmptyState text="Sin artistas todavía." /> : topArtistsByProfit.map((a, i) => (
          <RankRow
            key={a.id} position={i + 1} title={a.name} sub={a.genre || "Sin género"}
            primary={fmtMoney(a.profit)} secondary={`${fmtMoney(a.releaseProfit)} de lanzamientos + ${fmtMoney(a.tourRevenue - a.tourCosts)} de giras`}
            onClick={() => onOpenArtist(a.id)}
          />
        ))}
      </section>
      )}
    </div>
  );
}

function CompareTab({ releases, snapshots, releaseFinance, artistStats, artistName, onOpenRelease, onOpenArtist }) {
  const [mode, setMode] = useState("releases");
  const [selectedIds, setSelectedIds] = useState([]);
  const [selectedArtistIds, setSelectedArtistIds] = useState([]);
  const [pickerValue, setPickerValue] = useState("");
  const [artistPickerValue, setArtistPickerValue] = useState("");

  const selected = selectedIds.map((id) => releases.find((r) => r.id === id)).filter(Boolean);
  const available = releases.filter((r) => !selectedIds.includes(r.id)).sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));

  const selectedArtists = selectedArtistIds.map((id) => artistStats.find((a) => a.id === id)).filter(Boolean);
  const availableArtists = artistStats.filter((a) => !selectedArtistIds.includes(a.id)).sort((a, b) => a.name.localeCompare(b.name));

  const addRelease = (id) => {
    if (!id || selectedIds.includes(id) || selectedIds.length >= 6) return;
    setSelectedIds([...selectedIds, id]);
    setPickerValue("");
  };
  const removeRelease = (id) => setSelectedIds(selectedIds.filter((x) => x !== id));

  const addArtist = (id) => {
    if (!id || selectedArtistIds.includes(id) || selectedArtistIds.length >= 6) return;
    setSelectedArtistIds([...selectedArtistIds, id]);
    setArtistPickerValue("");
  };
  const removeArtist = (id) => setSelectedArtistIds(selectedArtistIds.filter((x) => x !== id));

  const snapshotsFor = (id) => [...snapshots].filter((s) => s.releaseId === id).sort((a, b) => Number(a.week) - Number(b.week));
  const latestFor = (id) => { const s = snapshotsFor(id); return s.length ? s[s.length - 1] : null; };

  const copiesSeries = selected.map((r, i) => ({
    label: r.title, color: CHART_PALETTE[i % CHART_PALETTE.length],
    points: snapshotsFor(r.id).filter((s) => s.copies !== null && s.copies !== undefined).map((s) => ({ x: Number(s.week), y: Number(s.copies) })),
  }));
  const revenueSeries = selected.map((r, i) => ({
    label: r.title, color: CHART_PALETTE[i % CHART_PALETTE.length],
    points: snapshotsFor(r.id).filter((s) => s.revenue !== null && s.revenue !== undefined).map((s) => ({ x: Number(s.week), y: Number(s.revenue) })),
  }));

  const RELEASE_METRICS = [
    { label: "Artista", render: (r) => artistName(r.artistId) },
    { label: "Tipo", render: (r) => r.type },
    { label: "Fecha", render: (r) => fmtDate(r.releaseDate) },
    { label: "Copias (últ.)", render: (r) => fmtNum(releaseFinance[r.id]?.copies) },
    { label: "Ingresos (últ.)", render: (r) => fmtMoney(releaseFinance[r.id]?.revenue) },
    { label: "Costes (últ.)", render: (r) => fmtMoney(releaseFinance[r.id]?.costs) },
    { label: "Beneficio (últ.)", render: (r) => fmtMoney((releaseFinance[r.id]?.revenue || 0) - (releaseFinance[r.id]?.costs || 0)) },
    { label: "Pico global", render: (r) => latestFor(r.id)?.peakGlobal || "—" },
    { label: "Semanas registradas", render: (r) => snapshotsFor(r.id).length },
  ];

  const ARTIST_METRICS = [
    { label: "Género", render: (a) => a.genre || "—" },
    { label: "Estado", render: (a) => a.status || "Activo" },
    { label: "Fichaje", render: (a) => fmtDate(a.signedDate) },
    { label: "Copias totales", render: (a) => fmtNum(a.copies) },
    { label: "Ingresos totales", render: (a) => fmtMoney(a.revenue) },
    { label: "Lanzamientos", render: (a) => `${a.releasesCount} (${a.albumsCount} álbum${a.albumsCount === 1 ? "" : "es"})` },
    { label: "Ingresos giras", render: (a) => fmtMoney(a.tourRevenue) },
    { label: "Nº giras", render: (a) => a.toursCount },
    { label: "Ingresos merch", render: (a) => fmtMoney(a.merchRevenue) },
    { label: "Último lanzamiento", render: (a) => (a.lastRelease ? fmtDate(a.lastRelease.releaseDate) : "—") },
  ];

  return (
    <div className="ltk-panel-stack">
      <header className="ltk-header"><h1>Comparador</h1><p>Compara lanzamientos entre sí, o artistas completos del sello.</p></header>

      <div className="ltk-channels" style={{ flexDirection: "row", gap: 8 }}>
        <button className={`ltk-btn-ghost ${mode === "releases" ? "is-active" : ""}`} onClick={() => setMode("releases")}>Lanzamientos</button>
        <button className={`ltk-btn-ghost ${mode === "artists" ? "is-active" : ""}`} onClick={() => setMode("artists")}>Artistas</button>
      </div>

      {mode === "releases" ? (

          <section className="ltk-card">
            <div className="ltk-filter-row">
              <div className="ltk-field">
                <label>Añadir lanzamiento</label>
                <select value={pickerValue} onChange={(e) => addRelease(e.target.value)}>
                  <option value="">Selecciona…</option>
                  {available.map((r) => <option key={r.id} value={r.id}>[{r.type}] {r.title} — {artistName(r.artistId)}</option>)}
                </select>
              </div>
              {selectedIds.length > 0 && <button type="button" className="ltk-btn-ghost" onClick={() => setSelectedIds([])}>Quitar todos</button>}
            </div>
            {selected.length > 0 && (
              <div className="ltk-chip-row" style={{ marginTop: 12 }}>
                {selected.map((r) => (

              <section className="ltk-card">
                <h2>Comparativa</h2>
                <div className="ltk-table-wrap">
                  <table className="ltk-table">

                      <tr>

                    </thead>
                    <tbody>
                      {RELEASE_METRICS.map((m) => (
                        <tr key={m.label}>
                          <td className="ltk-strong">{m.label}</td>
                          {selected.map((r) => <td key={r.id}>{m.render(r)}</td>)}

                      ))}
                    </tbody>
                  </table>
                </div>
              </section>

              <div className="ltk-grid-2">
                <section className="ltk-card">
                  <h2>Copias por semana</h2>
                  <MiniLineChart series={copiesSeries} yFormat={(y) => fmtNum(Math.round(y))} />
                </section>

      ) : (
        <React.Fragment>
          <section className="ltk-card">
            <div className="ltk-filter-row">
              <div className="ltk-field">
                <label>Añadir artista</label>
                <select value={artistPickerValue} onChange={(e) => addArtist(e.target.value)}>
                  <option value="">Selecciona…</option>
                  {availableArtists.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
              {selectedArtistIds.length > 0 && <button type="button" className="ltk-btn-ghost" onClick={() => setSelectedArtistIds([])}>Quitar todos</button>}
            </div>
            {selectedArtists.length > 0 && (
              <div className="ltk-chip-row" style={{ marginTop: 12 }}>
                {selectedArtists.map((a) => (
                  <span key={a.id} className="ltk-chip">
                    {a.name}
                    <button className="ltk-chip-remove" onClick={() => removeArtist(a.id)} title="Quitar de la comparación">✕</button>
                  </span>
                ))}
              </div>
            )}
          </section>

          {selectedArtists.length < 2 ? (
            <EmptyState text="Selecciona al menos dos artistas para compararlos." />
          ) : (
            <section className="ltk-card">
              <h2>Comparativa</h2>
              <div className="ltk-table-wrap">
                <table className="ltk-table">
                  <thead>
                    <tr>
                      <th>Métrica</th>
                      {selectedArtists.map((a) => (
                        <th key={a.id}>
                          <div className="ltk-compare-header-cell">
                            <button className="ltk-link" onClick={() => onOpenArtist(a.id)}>{a.name}</button>
                          </div>
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {ARTIST_METRICS.map((m) => (
                      <tr key={m.label}>
                        <td className="ltk-strong">{m.label}</td>
                        {selectedArtists.map((a) => <td key={a.id}>{m.render(a)}</td>)}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function EraImportPanel({ album, singles, snapshotsCrud }) {
  const [open, setOpen] = useState(false);
  const [rawText, setRawText] = useState("");
  const [blocks, setBlocks] = useState([]);

  // Opciones acotadas a esta etapa: el álbum y sus singles/EP, en orden de
  // publicación — así "single 1" es inequívocamente el primero que salió.
  const options = [album, ...singles];

  const guessReleaseId = (parsed) => {
    if (!parsed) return "";
    if (parsed.guessedType === "Álbum") return album.id;
    const idx = guessSingleIndex(parsed.releaseHint);
    if (idx && singles[idx - 1]) return singles[idx - 1].id;
    return "";
  };

  const analyze = () => {
    const rawBlocks = splitImportBlocks(rawText);
    const next = rawBlocks.map((b, i) => {
      let parsed = null, raw = "";
      if (b.type === "old") { parsed = parseSnapshotBlock(b.raw); raw = b.raw; }
      else if (b.type === "new") { parsed = parseSnapshotBlockV2(b.lines, b.globalRecognition); raw = b.lines.join("\n"); }
      else { raw = b.raw; }
      return { key: `${Date.now()}-${i}`, raw, parsed, releaseId: guessReleaseId(parsed) };
    });
    setBlocks(next);
  };

  const updateBlockRelease = (key, releaseId) => setBlocks(blocks.map((b) => (b.key === key ? { ...b, releaseId } : b)));
  const removeBlock = (key) => setBlocks(blocks.filter((b) => b.key !== key));
  const readyCount = blocks.filter((b) => b.parsed && b.releaseId).length;

  const [importedCount, setImportedCount] = useState(null);
  const importAll = () => {
    const n = readyCount;
    blocks.forEach((b) => {
      if (!b.parsed || !b.releaseId) return;
      snapshotsCrud.add({
        releaseId: b.releaseId,
        week: b.parsed.week,
        copies: b.parsed.copiesTotal ?? "",
        revenue: b.parsed.revenueTotal ?? "",
        costs: b.parsed.costsTotal ?? "",
        peakGlobal: b.parsed.peakGlobal ? `#${b.parsed.peakGlobal}` : "",
        regions: b.parsed.regions,
      });
    });
    setBlocks([]);
    setRawText("");
    setImportedCount(n);
    setTimeout(() => setImportedCount(null), 3500);
  };

  const releaseLabel = (id) => {
    const r = options.find((x) => x.id === id);
    return r ? `[${r.type}] ${r.title}` : "";
  };

  return (
    <section className="ltk-card">
      <div className="ltk-subhead">
        <h2>Importar desde texto</h2>
        {!open && <button className="ltk-btn-icon" onClick={() => setOpen(true)} title="Pegar mensajes de ventas semanales de esta etapa">✎</button>}
      </div>
      {open && (
        <div className="ltk-panel-stack" style={{ gap: 12, marginTop: 12 }}>
          <p className="ltk-muted" style={{ margin: 0 }}>
            Pega uno o varios mensajes de esta etapa, en cualquiera de los dos formatos que uses (el de párrafo único o el multilínea con "Single 1 - Semana N Copias: ... Pico Global #N" y una región por línea). "single 1" = primer single publicado del álbum, "single 2" = el segundo, "single promo" = el tercero, "álbum" = el álbum. Lo interpreto y te dejo revisar la asignación antes de guardar nada.
          </p>
          <textarea
            value={rawText}
            onChange={(e) => setRawText(e.target.value)}
            placeholder="semana 24 el single 1 ha vendido un total de 11.1k copias..."
            rows={6}
            style={{ background: "var(--panel-alt)", border: "1px solid var(--border)", color: "var(--text)", borderRadius: 6, padding: "10px 12px", fontFamily: "var(--font-mono)", fontSize: 12.5, resize: "vertical" }}
          />
          <div style={{ display: "flex", gap: 10 }}>
            <button className="ltk-btn" type="button" onClick={analyze} disabled={!rawText.trim()}>Analizar</button>
            <button className="ltk-btn-ghost" type="button" onClick={() => { setOpen(false); setBlocks([]); setRawText(""); }}>Cerrar</button>
          </div>

          {blocks.length > 0 && (
            <div className="ltk-panel-stack" style={{ gap: 10 }}>
              {blocks.map((b) => (
                <div key={b.key} className={`ltk-import-block ${!b.parsed ? "is-error" : ""}`}>
                  {!b.parsed ? (
                    <React.Fragment>
                      <div className="ltk-tag-danger ltk-tag" style={{ width: "fit-content" }}>No se pudo interpretar esta línea/bloque</div>
                      <div className="ltk-muted">{b.raw}</div>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <div className="ltk-subhead">
                        <div>
                          <span className="ltk-tag">Semana {b.parsed.week}</span>{" "}
                          <span className="ltk-muted">Detectado: “{b.parsed.releaseHint || "?"}”{b.releaseId && <> → {releaseLabel(b.releaseId)}</>}</span>
                        </div>
                        <button className="ltk-btn-icon is-danger" onClick={() => removeBlock(b.key)} title="Descartar">✕</button>
                      </div>
                      <div className="ltk-field">
                        <label>Corresponde a</label>
                        <select value={b.releaseId} onChange={(e) => updateBlockRelease(b.key, e.target.value)}>
                          <option value="">Selecciona…</option>
                          {options.map((r) => <option key={r.id} value={r.id}>[{r.type}] {r.title}</option>)}
                        </select>
                      </div>
                      <div className="ltk-import-summary">
                        Copias: {fmtNum(b.parsed.copiesTotal)} · Ingresos: {fmtMoney(b.parsed.revenueTotal)} · Costes: {fmtMoney(b.parsed.costsTotal)} · Pico global: {b.parsed.peakGlobal ? `#${b.parsed.peakGlobal}` : "—"}
                        {b.parsed.regions.length > 0 && (
                          <div>Regiones: {b.parsed.regions.map((r) => `${r.code} ${fmtNum(r.copies)} (#${r.peak || "—"}, ${r.recognitionPct || "0"}%)`).join(" · ")}</div>
                        )}
                      </div>
                    </React.Fragment>
                  )}
                </div>
              ))}
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <button className="ltk-btn" type="button" onClick={importAll} disabled={readyCount === 0}>
                  Importar {readyCount} registro{readyCount === 1 ? "" : "s"}
                </button>
              </div>
            </div>
          )}
          {importedCount !== null && (
            <span className="ltk-tag ltk-tag-success">✓ {importedCount} registro{importedCount === 1 ? "" : "s"} importado{importedCount === 1 ? "" : "s"}</span>
          )}
        </div>
      )}
    </section>
  );
}

// Pantalla para elegir una partida existente o crear una nueva (vacía),
// completamente independiente de las demás.
function SaveMenu({ onSelect }) {
  const [saves, setSaves] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState("");
  const [newName, setNewName] = useState("");
  const [creating, setCreating] = useState(false);
  const [importProgress, setImportProgress] = useState("");
  const [deletingId, setDeletingId] = useState(null);
  const [importFile, setImportFile] = useState(null); // { saveName, exportedAt, data: {...} }
  const [importFileName, setImportFileName] = useState("");
  const fileInputRef = React.useRef(null);

  const refresh = async () => {
    setLoaded(false);
    try {
      const { data, error } = await supabase.from("saves").select("*").order("created_at", { ascending: true });
      if (error) throw error;
      setSaves(data || []);
      setError("");
    } catch (e) {
      setError(e.message || String(e));
    }
    setLoaded(true);
  };
  useEffect(() => { refresh(); }, []);

  // Borra una partida entera: primero todos sus datos en las 6 tablas (por
  // save_id — no hay borrado en cascada automático, ya que save_id no es
  // una clave foránea real, solo una etiqueta), y al final la propia fila
  // de la partida. Las notas globales (save_id null) nunca se tocan.
  const deleteSave = async (id, name) => {
    if (!window.confirm(`¿Seguro que quieres borrar "${name}"?\n\nSe perderán TODOS sus datos (artistas, lanzamientos, giras, merch, notas) sin poder deshacerlo. Si quieres conservarlos, expórtala antes de borrarla.`)) return;
    setDeletingId(id);
    setError("");
    try {
      for (const table of ["snapshots", "tours", "merch", "notes", "releases", "artists"]) {
        const { error } = await supabaseWrite.from(table).delete().eq("save_id", id);
        if (error) throw new Error(`${table}: ${error.message}`);
      }
      const { error } = await supabaseWrite.from("saves").delete().eq("id", id);
      if (error) throw new Error(`saves: ${error.message}`);
      await refresh();
    } catch (e) {
      setError("Error borrando la partida: " + e.message);
    }
    setDeletingId(null);
  };

  const handleFilePicked = async (file) => {
    if (!file) return;
    setError("");
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !parsed.data || typeof parsed.data !== "object") {
        setError("Ese archivo no parece un export válido de Studio Desk.");
        return;
      }
      setImportFile(parsed);
      setImportFileName(file.name);
      setNewName(parsed.saveName ? `${parsed.saveName} (importada)` : "Partida importada");
    } catch (e) {
      setError("No se pudo leer el archivo: " + e.message);
    }
  };

  const cancelImport = () => {
    setImportFile(null);
    setImportFileName("");
    setNewName("");
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  // inserta todo el contenido del export en la partida recién creada,
  // respetando los mismos ids (para que las relaciones entre artista →
  // lanzamiento → semanas sigan funcionando tal cual), pero con el save_id
  // nuevo. Las notas "globales" del archivo se importan como propias de la
  // partida nueva (no vuelven a marcarse como globales, para no duplicarlas
  // en todas las demás partidas sin querer).
  // Se manda en tandas pequeñas (no todo de golpe): con portadas
  // incrustadas, una tabla como "releases" puede pesar más de un MB entera,
  // y eso puede fallar por tamaño o por tiempo de espera con un mensaje tan
  // genérico como "Something went wrong" — trocearlo lo evita, y de paso
  // deja claro en qué tanda concreta ha fallado si pasa. Si una tabla falla,
  // se sigue intentando con el resto (no se para todo por una sola tabla), y
  // se devuelve un resumen de qué se importó bien y qué no, en vez de
  // limitarse a abortar en el primer fallo.
  const importInto = async (newSaveId, data, onProgress) => {
    const CHUNK_SIZE = 8;
    const TABLES = [
      ["artists", data.artists, artistToRow],
      ["releases", data.releases, releaseToRow],
      ["snapshots", data.snapshots, snapshotToRow],
      ["tours", data.tours, tourToRow],
      ["merch", data.merch, merchToRow],
      ["notes", data.notes, noteToRow],
    ];
    const runOnePass = async (passLabel) => {
      const summary = [];
      for (const [table, rows, toRow] of TABLES) {
        const total = (rows || []).length;
        if (total === 0) { summary.push({ table, total: 0, inserted: 0, errors: [] }); continue; }
        const chunks = [];
        for (let i = 0; i < rows.length; i += CHUNK_SIZE) chunks.push(rows.slice(i, i + CHUNK_SIZE));
        let inserted = 0;
        const errors = [];
        for (let i = 0; i < chunks.length; i++) {
          const payload = chunks[i].map((r) => ({ ...toRow(r), save_id: newSaveId }));
          if (onProgress) onProgress(`${passLabel}: ${table} (${i + 1}/${chunks.length})…`);
          let lastErr = null;
          // hasta 4 intentos por tanda, con pausa creciente — Supabase ha
          // tenido temporadas inestables, así que se le da margen de sobra
          // antes de dar esa tanda por perdida en esta pasada (si no se
          // recupera aquí, la siguiente pasada completa vuelve a intentarlo)
          const delays = [1500, 3000, 6000];
          for (let attempt = 0; attempt < 4; attempt++) {
            if (attempt > 0) await new Promise((r) => setTimeout(r, delays[attempt - 1]));
            // upsert (no insert): reintentar una tanda que en realidad ya se
            // había guardado no choca con clave duplicada, y además permite
            // repetir pasadas enteras sin miedo a duplicar nada
            const { error } = await supabaseWrite.from(table).upsert(payload, { onConflict: "id" });
            if (!error) { lastErr = null; break; }
            lastErr = error;
          }
          if (lastErr) {
            const code = lastErr.code ? ` (código ${lastErr.code})` : "";
            errors.push(`tanda ${i + 1} de ${chunks.length}${code}: ${lastErr.message}`);
          } else {
            inserted += payload.length;
          }
        }
        summary.push({ table, total, inserted, errors });
      }
      return summary;
    };

    // hasta 3 pasadas completas: muchos de los fallos por clave foránea son
    // en cadena (un padre que falló transitoriamente bloquea a sus hijos) —
    // al repetir todo el proceso entero, esos padres ya existen la segunda
    // vez y sus hijos entran solos, sin tener que rastrear manualmente qué
    // dependía de qué
    let summary = await runOnePass("Pasada 1/3");
    for (let pass = 2; pass <= 3; pass++) {
      const hasErrors = summary.some((s) => s.errors.length > 0);
      if (!hasErrors) break;
      if (onProgress) onProgress(`Reintentando fallos (pasada ${pass}/3)…`);
      await new Promise((r) => setTimeout(r, 3000));
      summary = await runOnePass(`Pasada ${pass}/3`);
    }
    return summary;
  };

  const createSave = async () => {
    const name = newName.trim() || `Partida ${saves.length + 1}`;
    setCreating(true);
    let id = uid();
    try {
      let lastErr = null;
      // hasta 5 intentos con pausa creciente — es una acción puntual (no una
      // cola de cientos de elementos), así que se le puede dar bastante más
      // margen por si Supabase está teniendo un momento inestable. Se genera
      // un id nuevo en cada intento (no se reutiliza el mismo), por si algún
      // intento anterior sí llegó a guardarse a pesar de devolver error.
      const delays = [1000, 2000, 4000, 8000];
      for (let attempt = 0; attempt < 5; attempt++) {
        if (attempt > 0) { id = uid(); setImportProgress(`reintentando (${attempt + 1}/5)…`); await new Promise((r) => setTimeout(r, delays[attempt - 1] || 8000)); }
        const { error } = await supabaseWrite.from("saves").upsert([{ id, name, created_at: Date.now() }], { onConflict: "id" });
        if (!error) { lastErr = null; break; }
        lastErr = error;
      }
      setImportProgress("");
      if (lastErr) throw lastErr;
    } catch (e) {
      const report = buildErrorReport("saves", "insert", e, !("code" in e));
      setError(`${report.label} ${report.message}`);
      setCreating(false);
      return;
    }
    if (importFile) {
      try {
        const summary = await importInto(id, importFile.data, (label) => setImportProgress(label));
        const withErrors = summary.filter((s) => s.errors.length > 0);
        if (withErrors.length > 0) {
          const TABLE_LABEL = { artists: "artistas", releases: "lanzamientos", snapshots: "semanas", tours: "giras", merch: "merch", notes: "notas" };
          const lines = withErrors.map((s) => `${TABLE_LABEL[s.table] || s.table}: ${s.inserted}/${s.total} importados — ${s.errors[0]}${s.errors.length > 1 ? ` (+${s.errors.length - 1} tanda(s) más)` : ""}`);
          setError(`La partida "${name}" se creó, pero no todo se importó bien:\n${lines.join("\n")}\n\nPuedes reintentar borrándola y volviendo a importar el archivo, o entrar y completar lo que falte a mano.`);
        }
      } catch (e) {
        setCreating(false);
        setImportProgress("");
        setError(`La partida "${name}" se creó, pero hubo un error importando los datos: ` + e.message);
        cancelImport();
        await refresh();
        return;
      }
    }
    setCreating(false);
    setImportProgress("");
    cancelImport();
    // no se entra en la partida automáticamente — se refresca la lista y el
    // propio usuario elige cuándo entrar, pulsando sobre ella
    await refresh();
  };

  return (
    <div className="ltk-root">
      <div className="ltk-savemenu-wrap">
        <div className="ltk-savemenu">
          <div className="ltk-brand">
            <span className="ltk-brand-mark" />
            <div>
              <div className="ltk-brand-title">STUDIO DESK <span className="ltk-muted" style={{ fontFamily: "var(--font-mono)", fontSize: 9, fontWeight: 400 }}>{APP_VERSION}</span></div>
              <div className="ltk-brand-sub">Consola A&amp;R</div>
            </div>
          </div>

          <header className="ltk-header">
            <h1>Elige una partida</h1>
            <p>Cada partida tiene sus propios artistas, lanzamientos, giras, merch y notas — completamente separados del resto.</p>
          </header>

          {!loaded ? (
            <div className="ltk-muted">Cargando partidas…</div>
          ) : (
            <div className="ltk-savemenu-list">
              {saves.length === 0 && <EmptyState text="Todavía no hay ninguna partida creada." />}
              {saves.map((s) => (
                <div key={s.id} className="ltk-savemenu-item" style={{ display: "flex", flexDirection: "row", alignItems: "center", gap: 8, cursor: "default" }}>
                  <button style={{ flex: 1, textAlign: "left", background: "none", border: "none", cursor: "pointer", padding: 0, color: "inherit" }} onClick={() => onSelect(s.id, s.name)}>
                    <div className="ltk-list-title">{s.name}</div>
                    <div className="ltk-muted">Creada el {fmtDate(new Date(s.created_at).toISOString().slice(0, 10))}</div>
                  </button>
                  {isEditUnlocked() && (
                    <button
                      className="ltk-btn-icon is-danger" title="Borrar esta partida" disabled={deletingId === s.id}
                      onClick={(e) => { e.stopPropagation(); deleteSave(s.id, s.name); }}
                    >
                      {deletingId === s.id ? "…" : "✕"}
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}

          <section className="ltk-card">
            <h2>{importFile ? "Importar partida desde archivo" : "Nueva partida"}</h2>
            {!importFile ? (
              <p className="ltk-muted" style={{ marginTop: -4, marginBottom: 10 }}>
                Puedes crearla vacía, o{" "}
                <button type="button" className="ltk-link" onClick={() => fileInputRef.current && fileInputRef.current.click()}>importar un archivo exportado</button> desde otra partida o dispositivo.
              </p>
            ) : (
              <div className="ltk-editing-banner" style={{ marginBottom: 10 }}>
                📂 {importFileName} — {(importFile.data.artists || []).length} artistas, {(importFile.data.releases || []).length} lanzamientos, {(importFile.data.tours || []).length} giras, {(importFile.data.merch || []).length} merch, {(importFile.data.notes || []).length} notas.
                {" "}<button type="button" className="ltk-link" onClick={cancelImport}>Cancelar importación</button>
              </div>
            )}
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => handleFilePicked(e.target.files && e.target.files[0])} />
            {!isEditUnlocked() ? (
              <div style={{ marginBottom: 12 }}>
                <p className="ltk-muted" style={{ marginBottom: 8 }}>Este dispositivo está en modo solo lectura — hace falta desbloquear la edición aquí también para poder crear o importar una partida.</p>
                <EditLockPanel />
              </div>
            ) : (
              <div className="ltk-form">
                <div className="ltk-field ltk-field-wide">
                  <label>Nombre</label>
                  <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Ej. Sello 2" />
                </div>
                <button className="ltk-btn" onClick={createSave} disabled={creating}>
                  {creating ? (importProgress || "Creando…") : importFile ? "📂 Importar partida" : "+ Crear partida vacía"}
                </button>
              </div>
            )}
          </section>

          {error && <div className="ltk-error-banner" style={{ whiteSpace: "pre-line" }}>{error}</div>}
        </div>
      </div>
    </div>
  );
}

// Recuerda en este navegador qué partida tenías abierta, para no tener que
// elegirla cada vez, y permite volver al menú para cambiar o crear otra.
function AppRoot() {
  // Siempre se empieza en el menú de "Elige una partida" — nunca se entra
  // sola en ninguna, ni recordando la última usada.
  const [activeSaveId, setActiveSaveId] = useState(null);
  const [activeSaveName, setActiveSaveName] = useState("");
  const [showMenu, setShowMenu] = useState(false);

  const selectSave = (id, name) => {
    setActiveSaveId(id);
    setActiveSaveName(name || "");
    setShowMenu(false);
  };

  if (!activeSaveId || showMenu) {
    return <SaveMenu onSelect={selectSave} />;
  }
  return <App key={activeSaveId} activeSaveId={activeSaveId} activeSaveName={activeSaveName} onChangeSave={() => setShowMenu(true)} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AppRoot />);
</script>
</body>
</html>
