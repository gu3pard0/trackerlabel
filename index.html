<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Desk — Tracker de discográfica</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  // Se captura aquí mismo, nada más cargar el script, por si alguna
  // extensión del navegador redefine más tarde la variable global
  // "window.supabase" con otra cosa suya (ha pasado — deja de tener el
  // método createClient si eso ocurre).
  window.__supabaseCreateClient = window.supabase && window.supabase.createClient;
</script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
.ltk-root {
  --bg: #16151a; --panel: #1e1c22; --panel-alt: #24222a; --border: #322f38;
  --text: #f1eee7; --text-muted: #948f9c; --accent: #e8a33d; --accent-soft: rgba(232,163,61,0.14);
  --danger: #d9584f; --success: #6fcf97;
  --font-display: 'Oswald', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; width: 100%;
}
.ltk-shell { display: flex; min-height: 100vh; }
.ltk-sidebar { width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; }
.ltk-brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; border-bottom: 1px solid var(--border); }
.ltk-brand-mark { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); flex-shrink: 0; }
.ltk-brand-title { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; font-size: 15px; }
.ltk-brand-sub { color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); }
.ltk-channels { display: flex; flex-direction: column; gap: 4px; }
.ltk-channel { display: flex; align-items: center; gap: 10px; background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-family: var(--font-body); }
.ltk-channel:hover { background: var(--panel-alt); color: var(--text); }
.ltk-channel.is-active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.ltk-led { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.ltk-channel.is-active .ltk-led { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.ltk-ch-num { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
.ltk-ch-label { flex: 1; font-size: 13.5px; font-weight: 500; }
.ltk-ch-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.ltk-footnote { margin-top: auto; font-size: 10.5px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 10px; line-height: 1.5; }
.ltk-editlock { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px; }
.ltk-main { flex: 1; padding: 32px 36px 60px; overflow-x: hidden; }
.ltk-panel-stack { display: flex; flex-direction: column; gap: 22px; max-width: 1150px; }
.ltk-header h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: 0.02em; margin: 0 0 4px; }
.ltk-header p { color: var(--text-muted); margin: 0; font-size: 14px; }
.ltk-stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.ltk-stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.ltk-stat-card.is-accent { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--panel)); }
.ltk-stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.ltk-stat-value { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.ltk-stat-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
.ltk-grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; }
.ltk-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
.ltk-card h2 { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.03em; margin: 0 0 14px; }
.ltk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.ltk-list-row { display: flex; flex-direction: column; gap: 6px; }
.ltk-list-main { display: flex; justify-content: space-between; align-items: center; }
.ltk-list-title { font-weight: 600; font-size: 13.5px; }
.ltk-activity-row { display: flex; align-items: center; gap: 10px; }
.ltk-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.ltk-muted { color: var(--text-muted); font-size: 12px; }
.ltk-meter { height: 6px; background: var(--panel-alt); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
.ltk-meter-fill { height: 100%; }
.ltk-tag { font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
.ltk-tag-warn { color: var(--accent); border-color: var(--accent); }
.ltk-tag-danger { color: var(--danger); border-color: var(--danger); }
.ltk-tag-success { color: var(--success); border-color: var(--success); }
.ltk-artist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.ltk-artist-mini { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.ltk-mini-revenue { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.ltk-empty { color: var(--text-muted); font-size: 13px; padding: 18px 4px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }
.ltk-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.ltk-form-editing { border-color: var(--accent); }
.ltk-editing-banner { width: 100%; font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); margin-bottom: -2px; }
.ltk-field { display: flex; flex-direction: column; gap: 5px; min-width: 130px; flex: 1; }
.ltk-field-wide { flex: 2; min-width: 220px; }
.ltk-field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.ltk-root input, .ltk-root select { background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-family: var(--font-body); font-size: 13.5px; outline: none; width: 100%; }
.ltk-root input:focus, .ltk-root select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ltk-root input::placeholder { color: var(--text-muted); opacity: 0.7; }
.ltk-root select { cursor: pointer; }
.is-retired { opacity: 0.55; }
.ltk-cover-thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); background: var(--panel-alt); flex-shrink: 0; display: block; }
.ltk-cover-placeholder { width: 64px; height: 64px; border-radius: 8px; border: 1px dashed var(--border); background: var(--panel-alt); flex-shrink: 0; }
.ltk-single-row .ltk-cover-thumb, .ltk-single-row .ltk-cover-placeholder { width: 40px; height: 40px; border-radius: 6px; }
.ltk-chart-wrap { display: flex; flex-direction: column; gap: 8px; }
.ltk-chart-svg-wrap { position: relative; }
.ltk-chart-svg { width: 100%; height: auto; display: block; }
.ltk-chart-axis { stroke: var(--border); stroke-width: 1; }
.ltk-chart-axis-label { position: absolute; font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted); transform: translate(0, -50%); pointer-events: none; white-space: nowrap; }
.ltk-chart-axis-label-x { top: 100%; transform: translate(0, 4px); }
.ltk-chart-tooltip { position: absolute; transform: translate(-50%, -130%); background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px; font-size: 11px; line-height: 1.5; font-family: var(--font-mono); color: var(--text); white-space: nowrap; pointer-events: none; z-index: 5; box-shadow: 0 6px 16px rgba(0,0,0,0.45); }
.ltk-chart-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
.ltk-chart-legend-item { display: inline-flex; align-items: center; gap: 5px; }
.ltk-chart-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.ltk-rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.ltk-rank-row:last-child { border-bottom: none; }
.ltk-rank-pos { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); width: 20px; flex-shrink: 0; text-align: right; }
.ltk-rank-info { flex: 1; min-width: 0; }
.ltk-rank-value { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); white-space: nowrap; }
.ltk-timeline-row { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: center; }
.ltk-timeline-row:last-child { border-bottom: none; }
.ltk-timeline-row.is-today { background: var(--accent-soft); border-radius: 6px; padding-left: 6px; padding-right: 6px; }
.ltk-timeline-date { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); }
.ltk-narrative { max-width: 72ch; }
.ltk-narrative p { font-size: 14px; line-height: 1.75; color: var(--text); margin: 0 0 14px; }
.ltk-narrative p:first-child::first-letter { font-family: var(--font-display); font-size: 2.4em; float: left; line-height: 0.85; padding: 4px 6px 0 0; color: var(--accent); }
.ltk-filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.ltk-filter-row .ltk-field { min-width: 160px; flex: 0 1 200px; }
.ltk-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.ltk-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 20px; padding: 5px 8px 5px 12px; font-size: 12.5px; }
.ltk-chip-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.ltk-chip-remove:hover { color: var(--danger); }
.ltk-compare-header-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 130px; text-align: center; }
.ltk-import-block { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ltk-import-block.is-error { border-color: var(--danger); }
.ltk-import-summary { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }
.ltk-cover-picker { position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; min-height: 92px; border: 1px dashed var(--border); border-radius: 8px; background: var(--panel-alt); cursor: pointer; padding: 10px; text-align: center; outline: none; }
.ltk-cover-picker:hover { border-color: var(--accent); }
.ltk-cover-picker:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ltk-cover-picker.is-dragover { border-color: var(--accent); background: var(--accent-soft); }
.ltk-cover-picker-empty { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; max-width: 220px; }
.ltk-cover-picker-preview { max-height: 92px; max-width: 100%; border-radius: 6px; object-fit: contain; }
.ltk-cover-picker-input { display: none; }
.ltk-cover-picker-clear { margin-top: 6px; }
.ltk-btn { background: var(--accent); color: #1a1508; border: none; border-radius: 6px; padding: 9px 18px; font-family: var(--font-body); font-weight: 600; font-size: 13.5px; cursor: pointer; height: 37px; }
.ltk-btn:hover { filter: brightness(1.08); }
.ltk-btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; height: 37px; }
.ltk-btn-ghost.is-active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.ltk-btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
.ltk-btn:focus-visible, .ltk-channel:focus-visible, .ltk-btn-icon:focus-visible, .ltk-btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ltk-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.ltk-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ltk-table th { text-align: left; background: var(--panel-alt); color: var(--text-muted); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.ltk-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
.ltk-table tr:last-child td { border-bottom: none; }
.ltk-table tr.is-editing td { background: var(--accent-soft); }
.ltk-strong { font-weight: 600; }
.ltk-actions-cell { display: flex; gap: 6px; }
.ltk-btn-icon { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; flex-shrink: 0; }
.ltk-btn-icon:hover { color: var(--accent); border-color: var(--accent); }
.ltk-btn-icon.is-danger:hover { color: var(--danger); border-color: var(--danger); }
.ltk-btn-icon.is-active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.ltk-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
.ltk-gallery-card { position: relative; display: flex; flex-direction: column; gap: 8px; }
.ltk-gallery-card.is-editing { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 10px; }
.ltk-gallery-cover-btn { padding: 0; border: none; background: none; cursor: pointer; display: block; width: 100%; aspect-ratio: 1 / 1; }
.ltk-gallery-cover { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-alt); display: block; box-shadow: 0 6px 18px rgba(0,0,0,0.35); transition: transform 0.15s ease; }
.ltk-gallery-cover-btn:hover .ltk-gallery-cover { transform: translateY(-2px); }
.ltk-gallery-cover-placeholder { width: 100%; height: 100%; border-radius: 10px; border: 1px dashed var(--border); background: var(--panel-alt); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 32px; color: var(--text-muted); }
.ltk-gallery-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s ease; }
.ltk-gallery-card:hover .ltk-gallery-actions { opacity: 1; }
.ltk-gallery-actions .ltk-btn-icon { background: rgba(22,21,26,0.85); backdrop-filter: blur(2px); }
.ltk-gallery-info { display: flex; flex-direction: column; gap: 3px; }
.ltk-gallery-title { text-align: left; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ltk-gallery-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ltk-region-rows { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.ltk-region-row { display: grid; grid-template-columns: 90px 1fr 1fr 1fr 1fr 32px; gap: 8px; align-items: end; }
.ltk-subhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ltk-select-inline { min-width: 220px; max-width: 100%; }
@media (max-width: 860px) {
  .ltk-shell { flex-direction: column; }
  .ltk-sidebar { width: 100%; flex-direction: row; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px; gap: 10px; }
  .ltk-brand { border-bottom: none; padding: 0; flex-shrink: 0; }
  .ltk-footnote { display: none; }
  .ltk-channels { flex-direction: row; flex-shrink: 0; }
  .ltk-channel { flex-direction: column; align-items: flex-start; min-width: 84px; padding: 8px 10px; }
  .ltk-main { padding: 16px 14px 56px; }
  .ltk-stat-row { grid-template-columns: repeat(2, 1fr); }
  .ltk-grid-2 { grid-template-columns: 1fr; }
  .ltk-region-row { grid-template-columns: 1fr 1fr; }
}

/* Pantallas de móvil: todo apilado en una columna, objetivos táctiles más
   grandes, y tamaño de fuente >=16px en campos para que Safari/iOS no haga
   zoom automático al tocar un input (un problema clásico si se deja en 13px). */
@media (max-width: 640px) {
  html { -webkit-text-size-adjust: 100%; }
  .ltk-sidebar { padding: 8px 10px; gap: 8px; }
  .ltk-brand-title { font-size: 13px; }
  .ltk-brand-sub { font-size: 10px; }
  .ltk-channel { min-width: 72px; padding: 7px 8px; gap: 6px; }
  .ltk-ch-label { font-size: 12px; }
  .ltk-ch-num { font-size: 10px; }
  .ltk-main { padding: 14px 12px 60px; }
  .ltk-header h1 { font-size: 22px; }
  .ltk-header p { font-size: 13px; }
  .ltk-stat-row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .ltk-stat-value { font-size: 19px; }
  .ltk-card { padding: 14px 14px; }
  .ltk-card h2 { font-size: 14.5px; }

  /* formularios: una columna, campos y botones más altos para el dedo */
  .ltk-form { flex-direction: column; align-items: stretch; padding: 14px; gap: 10px; }
  .ltk-field, .ltk-field-wide { flex-basis: 100%; min-width: 0; width: 100%; }
  .ltk-filter-row { flex-direction: column; align-items: stretch; }
  .ltk-filter-row .ltk-field { flex-basis: 100%; }
  .ltk-root input, .ltk-root select, .ltk-root textarea { font-size: 16px; padding: 10px 12px; }
  .ltk-btn, .ltk-btn-ghost { height: 44px; font-size: 14px; }
  .ltk-form .ltk-btn, .ltk-form > .ltk-btn-ghost { width: 100%; }
  .ltk-btn-icon { width: 36px; height: 36px; font-size: 15px; }
  .ltk-subhead { flex-wrap: wrap; gap: 8px; }

  /* tablas: siguen con scroll horizontal, pero con letra legible y sin que
     la primera pulsación arrastre sin querer todo el layout */
  .ltk-table { font-size: 12px; }
  .ltk-table th, .ltk-table td { padding: 8px 10px; }
  .ltk-table-wrap { border-radius: 8px; -webkit-overflow-scrolling: touch; }
  .ltk-cover-thumb, .ltk-cover-placeholder { width: 40px; height: 40px; }

  .ltk-detail-hero { gap: 12px; }
  .ltk-detail-cover, .ltk-detail-cover-placeholder { width: 72px; height: 72px; }
  .ltk-detail-avatar { width: 52px; height: 52px; font-size: 18px; }
  .ltk-region-row { grid-template-columns: 1fr 1fr; gap: 6px; }
  .ltk-chip-row { gap: 6px; }
  .ltk-savemenu-wrap { padding: 24px 14px; }
  .ltk-rank-row { flex-wrap: wrap; }
}
.ltk-loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-family: var(--font-mono); color: var(--text-muted); }
.ltk-savemenu-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.ltk-savemenu { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
.ltk-savemenu-list { display: flex; flex-direction: column; gap: 10px; }
.ltk-savemenu-item { display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; text-align: left; color: var(--text); }
.ltk-savemenu-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.ltk-loading-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: ltk-pulse 1s ease-in-out infinite; }
@keyframes ltk-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.ltk-error-banner { background: rgba(217,88,79,0.12); border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 12px 16px; font-size: 12.5px; font-family: var(--font-mono); margin-bottom: 4px; }
.ltk-sync-banner { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 10px 16px; font-size: 12.5px; font-family: var(--font-mono); margin-bottom: 10px; }
.ltk-sync-banner.is-ok { background: rgba(111,207,151,0.12); border-color: var(--success); color: var(--success); }

// ---- Cola de sincronización persistente ----
// Cada alta/edición/borrado se aplica al momento en pantalla y se apunta
// aquí. Se intenta subir enseguida; si falla, se queda guardada en

// pase lo que pase (incluso si recargas la página o Supabase tarda minutos
// en volver), hasta que se sincroniza de verdad.
const SYNC_QUEUE_KEY = "ltk_pending_queue";
const SYNC_FAILED_KEY = "ltk_failed_queue";
function loadSyncQueue() {
  try { return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || "[]"); } catch { return []; }

  try { localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); } catch (e) { console.error(e); }
}

  try { return JSON.parse(localStorage.getItem(SYNC_FAILED_KEY) || "[]"); } catch { return []; }
}
function persistSyncFailed(q) {

let syncQueue = loadSyncQueue();
let syncFailed = loadSyncFailed();

let syncTimer = null;
let syncListeners = [];
function notifySync() { syncListeners.forEach((l) => l()); }

function enqueueChange(table, op, rowId, formData, saveId) {
  if (syncQueue.length === 0) syncSessionTotal = 0;
  syncQueue.push({ qid: uid(), table, op, rowId, formData: formData || {}, saveId, createdAt: Date.now(), attempts: 0 });

  persistSyncQueue(syncQueue);

  kickSync();
}

// Un rechazo con código real de Postgres/PostgREST significa que la
// petición SÍ llegó a la base de datos y la rechazó de verdad (un dato
// inválido, una regla que no se cumple...) — eso no se va a arreglar solo
// por esperar, así que se da por perdido rápido para no bloquear el resto.
// Una excepción sin código (fallo de red, Supabase caído o reiniciando) sí
// puede arreglarse sola, así que se le da mucha más paciencia — un reinicio
// de Supabase puede tardar un par de minutos, y una incidencia gorda, horas.
const SYNC_MAX_ATTEMPTS_DEFINITIVE = 3;
const SYNC_MAX_FAIL_MS_CONNECTION = 45 * 60 * 1000; // 45 minutos
async function flushSyncQueueOnce() {
  if (syncing) return;
  if (syncQueue.length === 0) { syncStatus = "idle"; notifySync(); return; }
  syncing = true;
  syncStatus = "syncing";
  notifySync();
  let stuck = false;
  while (syncQueue.length > 0 && !stuck) {
    const entry = syncQueue[0];
    const toRow = TABLE_MAPPERS[entry.table];
    let builtRow = null;

      let error;
      if (entry.op === "insert") {
        builtRow = { ...toRow({ id: entry.rowId, createdAt: entry.createdAt, ...entry.formData }), save_id: entry.formData.isGlobal ? null : entry.saveId };

        builtRow = toRow({ id: entry.rowId, ...entry.formData });

      } else if (entry.op === "delete") {
        ({ error } = await supabaseWrite.from(entry.table).delete().eq("id", entry.rowId));
      }
      if (error) throw error;
      syncQueue.shift();
      persistSyncQueue(syncQueue);

      entry.attempts += 1;
      if (!entry.firstFailedAt) entry.firstFailedAt = Date.now();

      entry.lastError = buildErrorReport(entry.table, entry.op, e, isException);
      // si es un fallo de red (no un rechazo real de la base de datos) y el
      // dato que se intentaba mandar pesa mucho (p. ej. una portada grande
      // incrustada), se apunta el tamaño — un timeout por payload grande se
      // ve exactamente igual que un fallo de conexión genérico, y esto
      // ayuda a distinguirlos
      if (isException && builtRow) {

        if (sizeKb > 30) entry.lastError.message += ` · dato a subir: ~${sizeKb} KB (puede ser el motivo — revisa si la portada es muy pesada)`;
      }

        ? Date.now() - entry.firstFailedAt >= SYNC_MAX_FAIL_MS_CONNECTION
        : entry.attempts >= SYNC_MAX_ATTEMPTS_DEFINITIVE;

        // detrás en la cola para siempre
        syncQueue.shift();
        syncFailed.push(entry);
        persistSyncFailed(syncFailed);
        persistSyncQueue(syncQueue);
        // no se marca "stuck": se sigue intentando con el resto de la cola
      } else {
        persistSyncQueue(syncQueue);
        stuck = true; // todavía dentro del margen de paciencia: no se adelanta al siguiente, para respetar el orden (ej. un artista antes que sus lanzamientos)

  entry.firstFailedAt = null;
  entry.lastError = null;

  syncFailed.forEach((entry) => { entry.attempts = 0; entry.firstFailedAt = null; entry.lastError = null; });

  const pending = [...syncQueue, ...syncFailed].filter((e) => e.table === table && e.saveId === saveId);

  pending.forEach((e) => {
    if (e.op === "insert") {

      result = result.map((x) => (x.id === e.rowId ? { ...x, ...e.formData } : x));
    } else if (e.op === "delete") {
      result = result.filter((x) => x.id !== e.rowId);
