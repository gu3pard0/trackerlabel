  const remove = (id) => {
    if (!isEditUnlocked()) { onError(buildErrorReport(table, "delete", { message: "🔒 Modo solo lectura — desbloquea la edición en este dispositivo para borrar nada." }, false)); return; }
    setItems((prev) => prev.filter((x) => x.id !== id));
    enqueueChange(table, "delete", id, null, saveId);
  };
  return { items, add, update, remove, loaded };
}

// Generic add/edit/delete form manager, delegando la persistencia al crud recibido
function useEditableList(list, crud, blankForm) {
  const [form, setForm] = useState(blankForm);
  const [editingId, setEditingId] = useState(null);
  const [justSaved, setJustSaved] = useState(false);
  const flashSaved = () => { setJustSaved(true); setTimeout(() => setJustSaved(false), 2200); };
  const startEdit = (item) => { setForm({ ...blankForm, ...item }); setEditingId(item.id); setJustSaved(false); };
  const cancel = () => { setForm(blankForm); setEditingId(null); };
  const submit = (e) => {
    e.preventDefault();
    if (editingId) {
      crud.update(editingId, form);
    } else {
      crud.add(form);
    }
    cancel();
    flashSaved();
  };
  const remove = (id) => {
    crud.remove(id);
    if (editingId === id) cancel();
  };
  return { form, setForm, editingId, startEdit, cancel, submit, remove, justSaved };
}

function latestSnapshot(snapshots, releaseId) {
  const own = snapshots.filter((s) => s.releaseId === releaseId);
  if (own.length === 0) return null;
  return [...own].sort((a, b) => Number(b.week) - Number(a.week))[0];
}

function addDaysISO(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function addYearsISO(dateStr, years) {
  const d = new Date(dateStr + "T00:00:00");
  d.setFullYear(d.getFullYear() + years);
  return d.toISOString().slice(0, 10);
}

// Un álbum marcado como "apto para edición de aniversario" avisa solo
// cuando se cumplen 10 años de SU lanzamiento — sin necesidad de crear
// ninguna edición de antemano. Se apaga cuando desmarcas la casilla tú
// mismo (una vez le has hecho caso).
function editionReminderDate(album) {
  if (!album || !album.releaseDate) return null;
  return addYearsISO(album.releaseDate, 10);
}
function isAnniversaryReminderDue(album, releases, appToday) {
  if (!album || !album.anniversaryCandidate) return false;
  const reminderDate = editionReminderDate(album);
  return !!reminderDate && appToday >= reminderDate;
}

const CHART_PALETTE = ["#e8a33d", "#6fcf97", "#d9584f", "#6ab0e0", "#c98be0", "#e0c85a", "#8de0c9", "#e08fb0"];

// Convierte "11.1k" -> 11100, "44.7k" -> 44700, "1.06M" -> 1060000, "58" -> 58, etc.
function parseNumK(str) {
  if (str === undefined || str === null || str === "") return null;
  const s = String(str).trim();
  const isM = /m$/i.test(s);
  const isK = !isM && /k$/i.test(s);
  const num = parseFloat(s.replace(/[kKmM]$/, "").replace(",", "."));
  if (isNaN(num)) return null;
  return Math.round(isM ? num * 1000000 : isK ? num * 1000 : num);
}

// Inversa de parseNumK: 11100 -> "11.1k", 1060000 -> "1.06M", 58 -> "58".
function formatCompactNum(n) {
  const num = Number(n) || 0;
  const abs = Math.abs(num);
  if (abs >= 1000000) return `${parseFloat((num / 1000000).toFixed(2))}M`;
  if (abs >= 1000) return `${parseFloat((num / 1000).toFixed(1))}k`;
  return String(Math.round(num));
}

// Genera las siglas por defecto de un artista a partir de su nombre
// (solo se usa como sugerencia de partida; el código corto real se guarda
// en su ficha y siempre tiene prioridad).
function autoShortCode(name) {
  return (name || "").split(/\s+/).filter(Boolean).map((w) => w[0].toUpperCase()).join("").slice(0, 4) || "??";
}

function singleLabel(idx) {
  if (idx === 0) return "Single 1";
  if (idx === 1) return "Single 2";
  if (idx === 2) return "Single Promo";
  return `Single ${idx + 1}`;
}

// Convierte la última actualización semanal de un lanzamiento al formato de
// texto multilínea (el mismo que ya sabe importar la app).
function formatSnapshotAsText(label, snap) {
  const peak = (snap.peakGlobal || "").toString().replace(/^#/, "") || "?";
  const lines = [
    `${label} - semana ${snap.week} Copias ${formatCompactNum(snap.copies)} Ingresos ${formatCompactNum(snap.revenue)}€ Costos ${formatCompactNum(snap.costs)}€ Pico Global #${peak}`,
  ];
  const regions = snap.regions || [];
  if (regions.length > 0) {
    lines.push(`Reconocimiento: ${regions.map((r) => `${r.code} ${r.recognitionPct || 0}%`).join(" ")}`);
    regions.forEach((r) => {
      lines.push(`${r.code} Copias ${formatCompactNum(r.copies)} Pico #${r.peak || "?"} Total ${formatCompactNum(r.revenue)}€`);
    });
  }
  return lines.join("\n");
}

// Reconstruye el mensaje de todo un ciclo (los singles del álbum, en orden,
// más el propio álbum) usando la última semana registrada de cada uno.
// Los lanzamientos sin ninguna semana registrada se omiten sin más.
function buildCycleExportText(album, singles, snapshots, artist, cycle) {
  const items = [...singles.map((s, i) => ({ label: singleLabel(i), id: s.id })), { label: album.type, id: album.id }];
  const blocks = items
    .map(({ label, id }) => {
      const snap = latestSnapshot(snapshots, id);
      return snap ? formatSnapshotAsText(label, snap) : null;
    })
    .filter(Boolean);
  if (blocks.length === 0) return "";
  const code = (artist && artist.shortCode) || autoShortCode(artist ? artist.name : "");
  return `${code} ciclo ${cycle}:\n${blocks.join("\n")}`;
}

// ---- Reconocimiento de capturas de pantalla (OCR) ----
// No usa coordenadas fijas: busca las etiquetas de texto de la interfaz
// (INGRESOS, COSTOS TOTALES, REGIÓN, RECONOCIMIENTO...) y toma el valor más
// cercano a cada una. Así funciona igual aunque cambie el tamaño o la
// resolución de la captura, siempre que la interfaz del juego sea la misma.
const REGION_NAME_MAP = [
  { code: "NA", first: "north", words: ["north", "america"] },
  { code: "UK", first: "united", words: ["united", "kingdom"] },
  { code: "EU", first: "europe", words: ["europe"] },
  { code: "JP", first: "japan", words: ["japan"] },
  { code: "RW", first: "rest", words: ["rest", "of", "the", "world"] },
  { code: "OC", first: "oceania", words: ["oceania"] },
];

// Distancia de edición (Levenshtein) básica, para poder aceptar el nombre
// de una región aunque el OCR se haya comido o cambiado alguna letra
// ("Eurcpe", "Europ"...), en vez de exigir una coincidencia exacta.
function editDistance(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// Cuando la fila de cabecera de la tabla de regiones no se ha podido leer
// (a veces el OCR se la salta entera), se calibra dónde está cada columna
// usando la primera fila de región que tenga los 4 datos completos: se
// agrupan las palabras a la derecha del nombre de la región en "valores"
// (separados por huecos grandes) y se identifican por su forma (%, #, $).
function findRegionNameSpan(words, tokens, afterY) {
  const first = words.find((w) => w.cy > afterY && w.text.toLowerCase().replace(/[^a-z]/g, "") === tokens[0]);
  if (!first) return null;
  let endX = first.x2, lastCy = first.cy;
  for (let i = 1; i < tokens.length; i++) {
    const next = words.find((w) => Math.abs(w.cy - lastCy) < 20 && w.x > endX && w.x - endX < 200 && w.text.toLowerCase().replace(/[^a-z]/g, "") === tokens[i]);
    if (next) endX = next.x2;
  }
  return { cy: first.cy, endX };
}
function clusterRowValues(words, rowY, xStart) {
  const rowWords = words
    .filter((w) => Math.abs(w.cy - rowY) < 20 && w.x > xStart)
    .filter((w) => !/^[—\-_.\s]+$/.test(w.text))
    .sort((a, b) => a.x - b.x);
  const clusters = [];
  let current = null;
  rowWords.forEach((w) => {
    if (current && w.x - current.lastX2 < 90) {
      current.words.push(w);
      current.lastX2 = w.x2;
    } else {
      current = { words: [w], lastX2: w.x2 };
      clusters.push(current);
    }
  });
  return clusters.map((c) => ({ cx: (c.words[0].x + c.words[c.words.length - 1].x2) / 2, text: c.words.map((w) => w.text).join(" ") }));
}
function calibrateColumnsFallback(words) {
  for (const { words: tokens } of REGION_NAME_MAP) {
    const span = findRegionNameSpan(words, tokens, 0);
    if (!span) continue;
    const clusters = clusterRowValues(words, span.cy, span.endX);
    if (clusters.length < 4) continue;
    const pct = clusters.find((c) => /%/.test(c.text));
    const money = clusters.find((c) => /[$€]/.test(c.text));
    const hash = clusters.find((c) => /#/.test(c.text));
    const ventas = clusters.find((c) => c !== pct && c !== money && c !== hash && /^\d/.test(c.text));
    if (pct && money && hash && ventas) return { recon: pct.cx, ventas: ventas.cx, pico: hash.cx, total: money.cx };
  }
  return null;
}

function ocrWordBoxes(words) {
  return (words || [])
    .filter((w) => w.text && w.text.trim())
    .map((w) => ({
      text: w.text.trim(),
      x: w.bbox.x0, y: w.bbox.y0, x2: w.bbox.x1, y2: w.bbox.y1,
      cx: (w.bbox.x0 + w.bbox.x1) / 2, cy: (w.bbox.y0 + w.bbox.y1) / 2,
    }));
}

function findWord(words, matcher) {
  return words.find((w) => matcher(w.text.toLowerCase()));
}

function textInZone(words, x1, x2, y1, y2) {
  return words
    .filter((w) => w.cx >= x1 && w.cx <= x2 && w.cy >= y1 && w.cy <= y2)
    .sort((a, b) => (Math.abs(a.cy - b.cy) < 15 ? a.x - b.x : a.cy - b.cy))
    .map((w) => w.text)
    .join(" ");
}

function extractNumberToken(text) {
  if (!text) return null;
  let clean = text.replace(/(\d{1,3})[,\s]+(\d{3})\b/g, "$1$2").replace(/,/g, "");
  // el OCR a veces confunde el punto decimal con un guion ("77-2" -> "77.2");
  // un guion inicial antes de todo el número sí se respeta como signo negativo
  clean = clean.replace(/(\d)-(\d)/g, "$1.$2");
  const m = clean.match(/-?\$?\s*(\d+(?:\.\d+)?)/);
  if (!m) return null;
  let num = parseFloat(m[1]);
  if (isNaN(num)) return null;
  if (/\bm[il1]{1,2}\b/i.test(clean) || /\bk\b/i.test(clean)) num *= 1000;
  else if (/\bm\b/i.test(clean)) num *= 1000000;
  return Math.round(num);
}
function extractPercent(text) {
  const m = (text || "").match(/([\d.]+)\s*%/);
  return m ? m[1] : null;
}
function extractHash(text) {
  const m = (text || "").match(/#\s*(\d+)/);
  if (m) return m[1];
  const bare = (text || "").trim().match(/^\d+$/);
  return bare ? bare[0] : null;
}

function valueBelow(words, label, maxDy, maxDx) {
  if (!label) return "";
  const candidates = words
    .filter((w) => w.cy > label.y2 - 4 && w.cy - label.y2 < (maxDy || 160) && Math.abs(w.cx - label.cx) < (maxDx || 150))
    .filter((w) => !/^[_\-.,'°"^~`;:]+$/.test(w.text));
  if (candidates.length === 0) return "";
  candidates.sort((a, b) => a.cy - b.cy);
  const nearY = candidates[0].cy;
  return candidates.filter((c) => Math.abs(c.cy - nearY) < 35).sort((a, b) => a.x - b.x).map((c) => c.text).join(" ");
}

// A veces el valor va en la MISMA fila que la etiqueta (ej. el recuadro
// "COSTOS $15.3 mil" del desglose), no debajo.
function valueRightSameRow(words, label, maxDx) {
  if (!label) return "";
  const candidates = words.filter((w) => w.cy > label.y - 10 && w.cy < label.y2 + 10 && w.x > label.x2 - 4 && w.x - label.x2 < (maxDx || 700));
  if (candidates.length === 0) return "";
  return candidates.sort((a, b) => a.x - b.x).map((c) => c.text).join(" ");
}

// "COSTOS TOTALES" (resumen) y "COSTOS $X mil" (desglose) suelen aparecer
// dos veces en la captura, con la etiqueta detectada de forma distinta cada
// vez y el valor a veces debajo, a veces en la misma fila — se prueban
// todas las coincidencias en ambas direcciones hasta encontrar un número.
// El margen se amplía porque el "mil" a veces queda bastante a la derecha
// de la etiqueta, sobre todo con cifras de varios dígitos.
function findCostsValue(words) {
  const matches = words.filter((w) => { const t = w.text.toLowerCase(); return t.includes("costos") || t.includes("totales"); });
  const candidates = [];
  matches.forEach((m) => {
    const below = extractNumberToken(valueBelow(words, m));
    if (below) candidates.push(below);
    const right = extractNumberToken(valueRightSameRow(words, m));
    if (right) candidates.push(right);
  });
  if (candidates.length === 0) return null;
  // una lectura truncada (sin el "mil", o cortada a mitad) siempre da un
  // número más pequeño que el real — nunca más grande — así que la lectura
  // correcta es la mayor de todas las candidatas encontradas
  return Math.max(...candidates);
}

// Ganancia neta = Ingresos − Costes totales, siempre. Se usa como
// verificación cruzada: si la lectura directa de "costes" da un número que
// no cuadra con esa resta (normalmente porque el OCR se comió el "mil" y
// devolvió una cifra mil veces más pequeña), se sustituye por el valor
// calculado a partir de ingresos y ganancia, que son más fáciles de leer.
function findGananciaValue(words) {
  const label = findWord(words, (t) => t.includes("ganancia"));
  if (!label) return null;
  return extractNumberToken(valueBelow(words, label, 160, 300)) ?? extractNumberToken(valueRightSameRow(words, label));
}

// El nombre de una región sale en un azul claro cuando el lanzamiento tiene
// datos reales ahí, y en gris neutro cuando no — es una señal mucho más
// fiable que intentar adivinar por los números, que a veces el OCR lee mal.
// Se busca el píxel más luminoso dentro del recuadro del texto (para caer
// sobre el propio trazo de la letra, no sobre el fondo) y se mira si el
// azul destaca claramente sobre el rojo.
function sampleRegionColor(ctx, wordBox) {
  if (!ctx || !wordBox) return { launched: true, reason: "sin-canvas" };
  try {
    const x = Math.max(0, Math.floor(wordBox.x));
    const y = Math.max(0, Math.floor(wordBox.y));
    const w = Math.max(1, Math.ceil(wordBox.x2 - wordBox.x));
    const h = Math.max(1, Math.ceil(wordBox.y2 - wordBox.y));
    const data = ctx.getImageData(x, y, w, h).data;
    let bestLum = -1, bestR = 0, bestG = 0, bestB = 0;
    for (let i = 0; i < data.length; i += 4) {
      const lum = data[i] + data[i + 1] + data[i + 2];
      if (lum > bestLum) { bestLum = lum; bestR = data[i]; bestG = data[i + 1]; bestB = data[i + 2]; }
    }
    if (bestLum < 0) return { launched: true, reason: "recuadro-vacio" };
    const diff = bestB - bestR;
    return { launched: diff > 25, r: bestR, g: bestG, b: bestB, diff, x, y, w, h, reason: diff > 25 ? "azul" : "gris" };
  } catch (e) {
    return { launched: true, reason: "error:" + e.message };
  }
}
function regionNameLooksLaunched(ctx, wordBox) {
  return sampleRegionColor(ctx, wordBox).launched;
}

// A partir de la lista de palabras (con su posición) que ha detectado el
// OCR, reconstruye un borrador de snapshot: semana, copias, ingresos,
// costes, pico global y la tabla de regiones. "ctx" es opcional: si se
// pasa el contexto 2D del mismo canvas que analizó el OCR, se usa para
// comprobar el color real de cada región (ver regionNameLooksLaunched).
// "diagnostics", si se pasa un array, se rellena con el detalle de cada
// región comprobada (encontrada o no, color visto, decisión) para poder
// enseñarlo en pantalla y saber exactamente qué ha pasado.
function extractSnapshotFromWords(words, ctx, diagnostics) {
  const ingresosLbl = findWord(words, (t) => t.includes("ingresos"));
  const vendidosWord = findWord(words, (t) => t.startsWith("vend"));
  const discosNearVendidos = vendidosWord ? words.find((w) => w.text.toLowerCase() === "discos" && Math.abs(w.cy - vendidosWord.cy) < 20) : null;
  const vendidosLbl = discosNearVendidos || vendidosWord;
  const picoMatches = words.filter((w) => /^pic[oq0]$/i.test(w.text)).sort((a, b) => a.y - b.y);
  const picoSummaryLbl = picoMatches[0];
  const fechaLbl = findWord(words, (t) => t.includes("fecha"));

  const revenue = extractNumberToken(valueBelow(words, ingresosLbl));
  let costs = findCostsValue(words);
  const copies = extractNumberToken(valueBelow(words, vendidosLbl));
  const peakRaw = extractHash(valueBelow(words, picoSummaryLbl));

  if (revenue !== null) {
    // en este juego los costes rondan siempre un 80-120% de los ingresos —
    // si sale muy por debajo de eso, la lectura es sospechosa (contaminación
    // de una caja vecina o un "mil" perdido) y se recalcula a partir de
    // ingresos - ganancia neta, que es más fiable en esos casos
    const costsLooksImplausible = costs !== null && costs < revenue * 0.3;
    if (costs === null || costsLooksImplausible) {
      const ganancia = findGananciaValue(words);
      if (ganancia !== null) {
        costs = Math.round(revenue - ganancia);
      }
    }
  }

  let week = "";
  if (fechaLbl) {
    const rowText = textInZone(words, fechaLbl.x, fechaLbl.x + 900, fechaLbl.y - 15, fechaLbl.y2 + 15);
    const durMatch = rowText.match(/(\d+)\s*(SEM|MES|A[ÑN]?O?)/i);
    if (durMatch) {
      const n = parseInt(durMatch[1], 10);
      const unit = durMatch[2].toUpperCase();
      week = unit.startsWith("SEM") ? n : unit.startsWith("MES") ? n * 4 : n * 48;
    }
  }

  const regions = [];
  const reconLbl = findWord(words, (t) => t.includes("reconocimiento"));
  const colX = reconLbl ? null : calibrateColumnsFallback(words);
  if (reconLbl || colX) {
    const headerY = reconLbl ? reconLbl.cy : 0;
    let cols = colX;
    if (!cols) {
      const discosColLbl = words.find((w) => Math.abs(w.cy - headerY) < 20 && w.text.toLowerCase() === "discos");
      const ventasColLbl = words.find((w) => Math.abs(w.cy - headerY) < 20 && w.text.toLowerCase().includes("ventas"));
      const picoColLbl = picoMatches.find((w) => Math.abs(w.cy - headerY) < 20);
      const totalLbl = words.find((w) => Math.abs(w.cy - headerY) < 20 && w.text.toLowerCase().includes("total"));
      cols = {
        recon: reconLbl.cx,
        ventas: discosColLbl ? discosColLbl.cx : ventasColLbl ? ventasColLbl.cx : reconLbl.cx + 400,
        pico: picoColLbl ? picoColLbl.cx : reconLbl.cx + 700,
        total: totalLbl ? totalLbl.cx : reconLbl.cx + 950,
      };
    }
    const nameXLimit = reconLbl ? reconLbl.x : cols.recon - 250;

    // primera pasada: localizar cada región por su nombre en el texto leído
    // (coincidencia exacta, o tolerante a 1-2 letras si el OCR lo leyó mal)
    const foundHits = REGION_NAME_MAP.map(({ code, first }) => {
      const exact = (w) => w.text.toLowerCase().replace(/[^a-z]/g, "") === first;
      const fuzzy = (w) => {
        const t = w.text.toLowerCase().replace(/[^a-z]/g, "");
        if (t.length < 3) return false;
        const tolerance = first.length <= 5 ? 1 : 2;
        return editDistance(t, first) <= tolerance;
      };
      const hit = words.find((w) => w.cy > headerY + 20 && w.cx < nameXLimit && exact(w)) || words.find((w) => w.cy > headerY + 20 && w.cx < nameXLimit && fuzzy(w));
      return { code, hit };
    });

    // segunda pasada: las regiones siempre van en el mismo orden fijo y con
    // el mismo espaciado entre filas — si a alguna no se le encontró el
    // nombre por texto, se calcula dónde debería estar a partir de las
    // filas vecinas que sí se encontraron, en vez de darla por perdida
    const present = foundHits.filter((f) => f.hit);
    if (present.length >= 2) {
      const gaps = [];
      for (let i = 1; i < present.length; i++) {
        const idxDiff = REGION_NAME_MAP.findIndex((r) => r.code === present[i].code) - REGION_NAME_MAP.findIndex((r) => r.code === present[i - 1].code);
        if (idxDiff > 0) gaps.push((present[i].hit.cy - present[i - 1].hit.cy) / idxDiff);
      }
      const avgGap = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : null;
      if (avgGap) {
        foundHits.forEach((f, i) => {
          if (f.hit) return;
          const ref = present.reduce((closest, p) => {
            const dist = Math.abs(REGION_NAME_MAP.findIndex((r) => r.code === p.code) - i);
            return !closest || dist < closest.dist ? { p, dist } : closest;
          }, null);
          if (!ref) return;
          const refIdx = REGION_NAME_MAP.findIndex((r) => r.code === ref.p.code);
          const estimatedCy = ref.p.hit.cy + avgGap * (i - refIdx);
          f.hit = { x: ref.p.hit.x, cy: estimatedCy, x2: ref.p.hit.x2, y: estimatedCy - (ref.p.hit.y2 - ref.p.hit.y) / 2, y2: estimatedCy + (ref.p.hit.y2 - ref.p.hit.y) / 2, estimated: true };
        });
      }
    }

    foundHits.forEach(({ code, hit }) => {
      if (!hit) {
        if (diagnostics) diagnostics.push({ code, found: false });
        return;
      }
      // el nombre de la región sale en azul cuando tiene datos reales ahí, y
      // en gris cuando no — se comprueba el color antes de fiarse de nada
      // más en esa fila (si la posición es estimada, se comprueba igual: el
      // color sigue siendo real, solo cambia de dónde se ha sacado la fila)
      const colorInfo = sampleRegionColor(ctx, hit);
      if (!colorInfo.launched) {
        if (diagnostics) diagnostics.push({ code, found: true, estimated: !!hit.estimated, color: colorInfo, included: false });
        return;
      }
      const rowY = hit.cy;
      const recognitionPct = extractPercent(textInZone(words, cols.recon - 130, cols.recon + 130, rowY - 22, rowY + 22));
      const rCopies = extractNumberToken(textInZone(words, cols.ventas - 170, cols.ventas + 170, rowY - 22, rowY + 22));
      const rPeak = extractHash(textInZone(words, cols.pico - 130, cols.pico + 130, rowY - 22, rowY + 22));
      const rRevenue = extractNumberToken(textInZone(words, cols.total - 190, cols.total + 230, rowY - 22, rowY + 22));
      // red de seguridad extra por si no hubiera canvas disponible: ruido
      // típico de una fila vacía es que copias e ingresos salgan como el
      // MISMO número diminuto (p.ej. "7" y "7"), algo que no pasa con datos
      // reales, donde ambos valores son muy distintos entre sí.
      const looksLikeNoise = rCopies !== null && rRevenue !== null && rCopies === rRevenue && rCopies < 100;
      const included = !looksLikeNoise && (rCopies || rRevenue);
      if (diagnostics) diagnostics.push({ code, found: true, estimated: !!hit.estimated, color: colorInfo, included: !!included, rCopies, rRevenue, looksLikeNoise });
      if (included) {
        regions.push({ code, recognitionPct: recognitionPct || "", copies: rCopies ?? "", peak: rPeak || "", revenue: rRevenue ?? "" });
      }
    });
  }

  return { week: week ? String(week) : "", copies: copies ?? "", revenue: revenue ?? "", costs: costs ?? "", peakGlobal: peakRaw ? `#${peakRaw}` : "", regions };
}

// Recorta la captura a la zona donde vive el panel de datos (excluyendo el
// ticker superior y el panel lateral, que solo meten ruido) y la amplía
// x2 — ambos pasos mejoran mucho la fiabilidad del OCR sobre esta interfaz.
// Se usan fracciones relativas al tamaño de la imagen, no píxeles fijos,
// para que funcione igual con capturas de distinta resolución.
function cropAndScaleForOcr(img, scale) {
  const fx1 = 0.172, fx2 = 0.885, fy1 = 0.093, fy2 = 0.880;
  const sx = img.width * fx1, sy = img.height * fy1;
  const sw = img.width * (fx2 - fx1), sh = img.height * (fy2 - fy1);
  const canvas = document.createElement("canvas");
  canvas.width = sw * scale;
  canvas.height = sh * scale;
  canvas.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas;
}

function ScreenshotScanner({ onExtracted, onClose }) {
  const [status, setStatus] = useState("idle"); // idle | working | error
  const [progress, setProgress] = useState(0);
  const [errorMsg, setErrorMsg] = useState("");
  const [regionDiagnostics, setRegionDiagnostics] = useState(null);
  const [diagCopied, setDiagCopied] = useState(false);
  const fileInputRef = React.useRef(null);

  const processImage = async (file) => {
    if (!file || !file.type || !file.type.startsWith("image/")) return;
    setStatus("working");
    setProgress(0);
    setErrorMsg("");
    setRegionDiagnostics(null);
    try {
      const img = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const im = new Image();
          im.onload = () => resolve(im);
          im.onerror = reject;
          im.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const canvas = cropAndScaleForOcr(img, 2);
      const worker = await Tesseract.createWorker("eng", 1, {
        logger: (m) => {
          if (m.status === "recognizing text") setProgress(Math.round((m.progress || 0) * 100));
        },
      });
      await worker.setParameters({ tessedit_pageseg_mode: "6" });
      const { data } = await worker.recognize(canvas);
      await worker.terminate();
      const words = ocrWordBoxes(data.words || []);
      const diagnostics = [];
      const extracted = extractSnapshotFromWords(words, canvas.getContext("2d"), diagnostics);
      setRegionDiagnostics(diagnostics);
      if (!extracted.week && !extracted.revenue && !extracted.copies && extracted.regions.length === 0) {
        setErrorMsg("No he podido localizar los datos en la imagen. Prueba con una captura más nítida y con el panel bien visible, o rellena a mano.");
        setStatus("error");
        return;
      }
      setStatus("idle");
      onExtracted(extracted);
    } catch (e) {
      console.error(e);
      setErrorMsg("Ha fallado el análisis de la imagen.");
      setStatus("error");
    }
  };

  const handlePaste = (e) => {
    const items = e.clipboardData ? e.clipboardData.items : [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.startsWith("image/")) {
        e.preventDefault();
        processImage(items[i].getAsFile());
        break;
      }
    }
  };

  return (
    <section className="ltk-card" style={{ marginTop: 10 }}>
      <div className="ltk-subhead">
        <h2>Escanear captura</h2>
        <button className="ltk-btn-icon" onClick={onClose} title="Cerrar">✕</button>
      </div>
      <p className="ltk-muted" style={{ margin: "6px 0 12px" }}>
        Sube o pega (Ctrl+V) la captura de la ficha de este lanzamiento en el juego. El análisis se hace en tu propio navegador — nada se envía fuera. Te rellenará el formulario de abajo para que lo revises antes de guardar.
      </p>
      <div
        className={`ltk-cover-picker`}
        tabIndex={0}
        onPaste={handlePaste}
        onClick={() => fileInputRef.current && fileInputRef.current.click()}
        style={{ minHeight: 70 }}
      >
        {status === "working" ? (
          <div className="ltk-cover-picker-empty">Analizando imagen… {progress}%</div>
        ) : (
          <div className="ltk-cover-picker-empty">Clic para elegir archivo, o pega una captura con Ctrl+V</div>
        )}
        <input ref={fileInputRef} type="file" accept="image/*" className="ltk-cover-picker-input" onChange={(e) => processImage(e.target.files && e.target.files[0])} />
      </div>
      {status === "error" && <div className="ltk-error-banner" style={{ marginTop: 10 }}>{errorMsg}</div>}
      {regionDiagnostics && regionDiagnostics.length > 0 && (
        <div className="ltk-error-banner" style={{ marginTop: 10, color: "var(--text)", borderColor: "var(--border)", background: "var(--panel-alt)" }}>
          <div style={{ fontWeight: 600, marginBottom: 6 }}>Diagnóstico de regiones (para depurar si falta alguna):</div>
          {regionDiagnostics.map((d, i) => (
            <div key={i} style={{ marginBottom: 2 }}>
              <strong>{d.code}</strong>{" "}
              {!d.found
                ? "→ no se encontró el nombre de la región en el texto leído, ni por posición estimada"
                : !d.color
                ? "→ encontrada, sin dato de color"
                : `→ ${d.estimated ? "(posición estimada por espaciado) " : ""}color RGB(${d.color.r},${d.color.g},${d.color.b}) diff=${d.color.diff} → ${d.color.launched ? "azul" : "gris"}` +
                  (d.color.launched ? `, copias=${d.rCopies ?? "null"}, ingresos=${d.rRevenue ?? "null"}${d.looksLikeNoise ? " (ruido, descartada)" : ""}` : "") +
                  ` → ${d.included ? "INCLUIDA" : "descartada"}`}
            </div>
          ))}
          <button
            className="ltk-btn-ghost"
            style={{ marginTop: 8 }}
            onClick={async () => {
              const text = regionDiagnostics.map((d) => `${d.code}: ${JSON.stringify(d)}`).join("\n");
              try { await navigator.clipboard.writeText(text); setDiagCopied(true); setTimeout(() => setDiagCopied(false), 2000); } catch (e) { console.error(e); }
            }}
          >
            {diagCopied ? "✓ Copiado" : "Copiar diagnóstico"}
          </button>
        </div>
      )}
    </section>
  );
}

function guessReleaseType(hint) {
  const h = (hint || "").toLowerCase();
  if (h.includes("álbum") || h.includes("album")) return "Álbum";
  if (h.includes("ep")) return "EP";
  if (h.includes("single")) return "Single";
  return null;
}

// "single 1" -> 1, "single 2" -> 2, "single promo" -> 3 (convención: el promo
// es siempre el tercer single de la etapa). Devuelve null si no reconoce nada.
function guessSingleIndex(hint) {
  const h = (hint || "").toLowerCase();
  if (/promo/.test(h)) return 3;
  const m = h.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// Interpreta un párrafo tipo "semana 24 el single 1 ha vendido un total de
// 11.1k copias, vendio 10458 en NA lo que suponen 41.8k€, ... llego al pico
// de top 11 en listas en NA, ... costos totales de 44.7k€ ... reconocimiento
// ha aumentado a 15.3% en NA, ..." y lo convierte en un borrador de snapshot.
function parseSnapshotBlock(raw) {
  const text = raw.trim();
  const weekMatch = text.match(/semana\s+(\d+)/i);
  if (!weekMatch) return null;
  const week = weekMatch[1];

  const hintMatch = text.match(/semana\s+\d+\s+el\s+([a-záéíóúñ]+(?:\s+[a-záéíóúñ0-9]+)?)\s+ha\s+vendido/i);
  const releaseHint = hintMatch ? hintMatch[1].trim() : "";

  const copiesMatch = text.match(/vendido un total de\s+([\d.,]+[kKmM]?)\s*copias/i);
  const copiesTotal = copiesMatch ? parseNumK(copiesMatch[1]) : null;

  const revenueMatch = text.match(/en total suponen\s+([\d.,]+[kKmM]?)\s*€/i);
  const revenueTotal = revenueMatch ? parseNumK(revenueMatch[1]) : null;

  const costsMatch = text.match(/costos?\s+totales\s+de\s+([\d.,]+[kKmM]?)\s*€/i);
  const costsTotal = costsMatch ? parseNumK(costsMatch[1]) : null;

  const regions = {};
  const regionRe = /([\d.,]+[kKmM]?)\s+en\s+([A-Z]{2,4})\s+lo que suponen\s+([\d.,]+[kKmM]?)\s*€/g;
  let m;
  while ((m = regionRe.exec(text))) {
    regions[m[2]] = regions[m[2]] || {};
    regions[m[2]].copies = parseNumK(m[1]);
    regions[m[2]].revenue = parseNumK(m[3]);
  }

  const peakRe = /top\s+(\d+)\s+en\s+(?:listas\s+en\s+)?(el mundo|[A-Z]{2,4})/gi;
  let peakGlobal = null;
  while ((m = peakRe.exec(text))) {
    if (/el mundo/i.test(m[2])) {
      peakGlobal = m[1];
    } else {
      regions[m[2]] = regions[m[2]] || {};
      regions[m[2]].peak = m[1];
    }
  }

  const recogRe = /([\d.,]+)%\s+en\s+([A-Z]{2,4})/g;
  while ((m = recogRe.exec(text))) {
    regions[m[2]] = regions[m[2]] || {};
    regions[m[2]].recognitionPct = m[1];
  }

  const regionList = Object.keys(regions).map((code) => ({
    code,
    copies: regions[code].copies ?? "",
    revenue: regions[code].revenue ?? "",
    peak: regions[code].peak ?? "",
    recognitionPct: regions[code].recognitionPct ?? "",
  }));

  return {
    week, releaseHint, guessedType: guessReleaseType(releaseHint),
    copiesTotal, revenueTotal, costsTotal, peakGlobal, regions: regionList, raw: text,
  };
}

// Formato multilínea. La línea de cabecera es siempre
// "Single 1 - Semana N Copias X Ingresos Y€ Costos Z€ Pico Global #N".
// Las regiones pueden venir de tres maneras distintas (y hasta mezcladas):
// - "NA Reconocimiento 18.3% Copias 3089 Pico #6 Ingresos: 12.4k€" (todo junto)
// - "NA Copias 377 Pico #34 Total 1.5k€" + una línea aparte
//   "Reconocimiento: NA 1.4% JP 5%" con los porcentajes de varias regiones
// `globalRecognition` son porcentajes puestos UNA sola vez al principio del
// mensaje (antes del primer single/álbum) que se aplican a todos los
// lanzamientos siguientes salvo que alguno traiga su propio reconocimiento.
function parseSnapshotBlockV2(lines, globalRecognition) {
  const head = lines[0] || "";
  const m = head.match(/^(single|ep|álbum|album)\s*([^-]*?)\s*-\s*semana\s+(\d+)\s+copias:?\s*([\d.,]+[kKmM]?)\s+ingresos:?\s*([\d.,]+[kKmM]?)\s*€?\s+costos?:?\s*([\d.,]+[kKmM]?)\s*€?\s+pico\s+global\s+#?(\d+)/i);
  if (!m) return null;

  const releaseHint = `${m[1]}${m[2] ? " " + m[2] : ""}`.trim();
  const week = m[3];
  const copiesTotal = parseNumK(m[4]);
  const revenueTotal = parseNumK(m[5]);
  const costsTotal = parseNumK(m[6]);
  const peakGlobal = m[7];

  const regionFullRe = /^([A-Z]{2,4})\s+reconocimiento\s+([\d.,]+)%\s+copias\s+([\d.,]+[kKmM]?)\s+pico\s+#?(\d+)\s+ingresos:?\s*([\d.,]+[kKmM]?)\s*€?/i;
  const regionTotalRe = /^([A-Z]{2,4})\s+copias\s+([\d.,]+[kKmM]?)\s+pico\s+#?(\d+)\s+total\s+([\d.,]+[kKmM]?)\s*€?/i;
  const recognitionSummaryRe = /^reconocimiento:?\s+(.+)$/i;

  const regions = {};
  const merge = (code, patch) => { regions[code] = { ...(regions[code] || {}), ...patch }; };
  Object.keys(globalRecognition || {}).forEach((code) => merge(code, { recognitionPct: globalRecognition[code] }));

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    let rm = line.match(regionFullRe);
    if (rm) { merge(rm[1].toUpperCase(), { recognitionPct: rm[2], copies: parseNumK(rm[3]), peak: rm[4], revenue: parseNumK(rm[5]) }); continue; }
    rm = line.match(regionTotalRe);
    if (rm) { merge(rm[1].toUpperCase(), { copies: parseNumK(rm[2]), peak: rm[3], revenue: parseNumK(rm[4]) }); continue; }
    rm = line.match(recognitionSummaryRe);
    if (rm) {
      const pairRe = /([A-Z]{2,4})\s+([\d.,]+)%/gi;
      let pm;
      while ((pm = pairRe.exec(rm[1]))) merge(pm[1].toUpperCase(), { recognitionPct: pm[2] });
    }
  }

  const regionList = Object.keys(regions).map((code) => ({
    code, copies: regions[code].copies ?? "", revenue: regions[code].revenue ?? "",
    peak: regions[code].peak ?? "", recognitionPct: regions[code].recognitionPct ?? "",
  }));

  return { week, releaseHint, guessedType: guessReleaseType(releaseHint), copiesTotal, revenueTotal, costsTotal, peakGlobal, regions: regionList, raw: lines.join("\n") };
}

// Recorre el texto pegado línea a línea y agrupa cada actualización en su
// bloque, reconociendo el formato de párrafo único ("semana N el X ha
// vendido...") y las variantes multilínea (con o sin "Reconocimiento" por
// región, con "Ingresos" o "Total"). Las líneas de cabecera ("TDS ciclo 4:")
// son solo contexto y se descartan sin marcarse como error. Cualquier línea
// "Reconocimiento: ..." — esté suelta antes del primer single, o pegada
// dentro del primero de ellos — se guarda como reconocimiento por defecto y
// se aplica también a los lanzamientos que vengan después y no traigan el
// suyo propio, hasta que otra línea de este tipo la reemplace.
function splitImportBlocks(rawText) {
  const lines = rawText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const headerRe = /^[A-ZÁÉÍÓÚÑ]{2,8}\s+ciclo\s+\d+\s*:?\s*$/i;
  const oldFormatRe = /ha vendido un total de/i;
  const releaseLineRe = /^(single|ep|álbum|album)\b[^-]*-\s*semana\s+\d+/i;
  const regionLineRe = /^[A-Z]{2,4}\s+(reconocimiento|copias)\s+/i;
  const recognitionSummaryLineRe = /^reconocimiento:?\s+(\S.*)$/i;

  const blocks = [];
  let current = null;
  let pendingRecognition = {};
  const closeCurrent = () => { if (current) { blocks.push(current); current = null; } };

  lines.forEach((line) => {
    if (headerRe.test(line)) { closeCurrent(); return; }
    if (oldFormatRe.test(line)) { closeCurrent(); blocks.push({ type: "old", raw: line }); return; }
    if (releaseLineRe.test(line)) { closeCurrent(); current = { type: "new", lines: [line], globalRecognition: { ...pendingRecognition } }; return; }
    const recMatch = line.match(recognitionSummaryLineRe);
    if (recMatch) {
      const pairRe = /([A-Z]{2,4})\s+([\d.,]+)%/gi;
      let pm;
      while ((pm = pairRe.exec(recMatch[1]))) pendingRecognition[pm[1].toUpperCase()] = pm[2];
      if (current) current.lines.push(line);
      return;
    }
    if (current && regionLineRe.test(line)) { current.lines.push(line); return; }
    closeCurrent();
    blocks.push({ type: "unknown", raw: line });
  });
  closeCurrent();
  return blocks;
}

// Gráfico de líneas ligero en SVG puro (sin librerías) para evolución
// semanal de copias/ingresos/costes o reconocimiento por región.
function MiniLineChart({ series, xFormat, yFormat }) {
  const width = 640, height = 170, padding = 34;
  const fmtX = xFormat || ((x) => `Semana ${x}`);
  const fmtYval = yFormat || ((y) => fmtNum(Math.round(y)));
  const allPoints = series.flatMap((s) => s.points);
  if (allPoints.length < 2) return <EmptyState text="Necesitas al menos 2 semanas registradas para ver la evolución." />;
  const xs = allPoints.map((p) => p.x), ys = allPoints.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const maxY = Math.max(...ys, 1);
  const scaleX = (x) => padding + (maxX === minX ? 0 : (x - minX) / (maxX - minX)) * (width - padding * 2);
  const scaleY = (y) => height - padding - (y / maxY) * (height - padding * 2);
  const [hover, setHover] = useState(null);

  return (
    <div className="ltk-chart-wrap">
      <div className="ltk-chart-svg-wrap">
        <svg viewBox={`0 0 ${width} ${height}`} className="ltk-chart-svg" preserveAspectRatio="xMidYMid meet">
          <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} className="ltk-chart-axis" />
          <line x1={padding} y1={padding} x2={padding} y2={height - padding} className="ltk-chart-axis" />
          {series.map((s, i) => {
            const pts = [...s.points].sort((a, b) => a.x - b.x);
            return <polyline key={i} fill="none" stroke={s.color} strokeWidth="2" points={pts.map((p) => `${scaleX(p.x)},${scaleY(p.y)}`).join(" ")} />;
          })}
          {series.map((s, i) => [...s.points].map((p, j) => (
            <circle
              key={`${i}-${j}`} cx={scaleX(p.x)} cy={scaleY(p.y)} r="5" fill={s.color} stroke="var(--panel)" strokeWidth="1"
              style={{ cursor: "pointer" }}
              onMouseEnter={() => setHover({ sx: scaleX(p.x), sy: scaleY(p.y), label: s.label, xText: fmtX(p.x), yText: fmtYval(p.y) })}
              onMouseLeave={() => setHover(null)}
            />
          )))}
        </svg>
        <div className="ltk-chart-axis-label" style={{ left: 2, top: `${(padding / height) * 100}%` }}>{fmtYval(maxY)}</div>
        <div className="ltk-chart-axis-label" style={{ left: 2, top: `${((height - padding) / height) * 100}%` }}>{fmtYval(0)}</div>
        <div className="ltk-chart-axis-label ltk-chart-axis-label-x" style={{ left: `${(padding / width) * 100}%` }}>{fmtX(minX)}</div>
        <div className="ltk-chart-axis-label ltk-chart-axis-label-x" style={{ left: `${((width - padding) / width) * 100}%`, transform: "translate(-100%, 4px)" }}>{fmtX(maxX)}</div>
        {hover && (
          <div className="ltk-chart-tooltip" style={{ left: `${(hover.sx / width) * 100}%`, top: `${(hover.sy / height) * 100}%` }}>
            <strong>{hover.label}</strong><br />{hover.xText}: {hover.yText}
          </div>
        )}
      </div>
      <div className="ltk-chart-legend">
        {series.map((s, i) => (
          <span key={i} className="ltk-chart-legend-item"><span className="ltk-chart-swatch" style={{ background: s.color }} />{s.label}</span>
        ))}
      </div>
    </div>
  );
}

// Redimensiona y comprime una imagen (archivo o pegado) a una data URL JPEG
// ligera para guardarla directamente en la fila del lanzamiento.
function resizeImageFile(file, maxDim = 360, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo leer la imagen"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function CoverPicker({ value, onChange }) {
  const [dragOver, setDragOver] = useState(false);
  const [busy, setBusy] = useState(false);
  const fileInputRef = React.useRef(null);

  const processFile = async (file) => {
    if (!file || !file.type || !file.type.startsWith("image/")) return;
    setBusy(true);
    try {
      onChange(await resizeImageFile(file));
    } catch (e) {
      console.error(e);
    }
    setBusy(false);
  };

  const handlePaste = (e) => {
    const items = e.clipboardData ? e.clipboardData.items : [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.startsWith("image/")) {
        e.preventDefault();
        processFile(items[i].getAsFile());
        break;
      }
    }
  };

  return (
    <div className="ltk-field ltk-field-wide">
      <label>Portada</label>
      <div
        className={`ltk-cover-picker ${dragOver ? "is-dragover" : ""}`}
        tabIndex={0}
        onPaste={handlePaste}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); processFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}
        onClick={() => fileInputRef.current && fileInputRef.current.click()}
      >
        {value ? (
          <img className="ltk-cover-picker-preview" src={value} alt="Portada" />
        ) : (
          <div className="ltk-cover-picker-empty">{busy ? "Procesando imagen…" : "Clic para elegir archivo, o pega una imagen con Ctrl+V"}</div>
        )}
        <input ref={fileInputRef} type="file" accept="image/*" className="ltk-cover-picker-input" onChange={(e) => processFile(e.target.files && e.target.files[0])} />
      </div>
      {value && <button type="button" className="ltk-btn-ghost ltk-cover-picker-clear" onClick={() => onChange("")}>Quitar portada</button>}
    </div>
  );
}

function App({ activeSaveId, activeSaveName, onChangeSave }) {
  const [tab, setTab] = useState("dashboard");
  const [detail, setDetail] = useState(null); // { type: "artist" | "release", id }
  const [dbErrors, setDbErrors] = useState([]);
  const onError = useCallback((report) => {
    setDbErrors((prev) => (prev.some((e) => e.label === report.label && e.message === report.message) ? prev : [...prev, report]));
  }, []);

  const goToTab = (key) => { setDetail(null); setTab(key); };
  const openArtist = (id) => setDetail({ type: "artist", id });
  const openRelease = (id) => setDetail({ type: "release", id });

  const artistsCrud = useSupabaseTable("artists", artistToRow, artistFromRow, onError, activeSaveId);
  const releasesCrud = useSupabaseTable("releases", releaseToRow, releaseFromRow, onError, activeSaveId);
  const snapshotsCrud = useSupabaseTable("snapshots", snapshotToRow, snapshotFromRow, onError, activeSaveId);
  const toursCrud = useSupabaseTable("tours", tourToRow, tourFromRow, onError, activeSaveId);
  const merchCrud = useSupabaseTable("merch", merchToRow, merchFromRow, onError, activeSaveId);
  const notesCrud = useSupabaseTable("notes", noteToRow, noteFromRow, onError, activeSaveId, true);

  const artists = artistsCrud.items, releases = releasesCrud.items, snapshots = snapshotsCrud.items;
  const tours = toursCrud.items, merch = merchCrud.items, notes = notesCrud.items;
  const loading = !(artistsCrud.loaded && releasesCrud.loaded && snapshotsCrud.loaded && toursCrud.loaded && merchCrud.loaded && notesCrud.loaded);

  const artistName = useCallback((id) => artists.find((a) => a.id === id)?.name || "—", [artists]);
  const releaseTitle = useCallback((id) => releases.find((r) => r.id === id)?.title || "—", [releases]);

  // "Hoy" para la app es la fecha más reciente que hayas introducido en
  // cualquier ficha (fichajes, lanzamientos, fechas de gira), no la fecha
  // real del sistema. Así funciona igual de bien si llevas el sello en 1950.
  const appToday = useMemo(() => {
    const dates = [
      ...artists.map((a) => a.signedDate),
      ...releases.map((r) => r.releaseDate),
      ...tours.flatMap((t) => [t.startDate, t.endDate, t.onSaleDate, t.soldOutDate]),
    ].filter(Boolean);
    if (dates.length === 0) return todayISO();
    return dates.reduce((max, d) => (d > max ? d : max));
  }, [artists, releases, tours]);

  const releaseFinance = useMemo(() => {
    const map = {};
    releases.forEach((r) => {
      const snap = latestSnapshot(snapshots, r.id);
      map[r.id] = { revenue: snap ? Number(snap.revenue) || 0 : 0, costs: snap ? Number(snap.costs) || 0 : 0, copies: snap ? Number(snap.copies) || 0 : 0 };
    });
    return map;
  }, [releases, snapshots]);

  const totals = useMemo(() => {
    const releaseRevenue = Object.values(releaseFinance).reduce((s, x) => s + x.revenue, 0);
    const releaseCosts = Object.values(releaseFinance).reduce((s, x) => s + x.costs, 0);
    const releaseCopies = Object.values(releaseFinance).reduce((s, x) => s + x.copies, 0);
    const tourRevenue = tours.reduce((s, x) => s + (Number(x.revenue) || 0), 0);
    const tourCosts = tours.reduce((s, x) => s + (Number(x.costs) || 0), 0);
    const merchRevenue = merch.reduce((s, x) => s + (Number(x.revenue) || 0), 0);
    const releaseProfit = releaseRevenue - releaseCosts;
    return {
      releaseRevenue, releaseCosts, releaseCopies, tourRevenue, tourCosts, merchRevenue,
      releaseProfit,
      profit: releaseProfit + tourRevenue - tourCosts,
      total: releaseRevenue + tourRevenue + merchRevenue,
    };
  }, [releaseFinance, tours, merch]);

  const artistStats = useMemo(() => {
    return artists.map((a) => {
      const own = releases.filter((r) => r.artistId === a.id && r.releaseDate);
      const last = own.sort((x, y) => new Date(y.releaseDate) - new Date(x.releaseDate))[0];
      const daysSince = last ? daysBetween(last.releaseDate, appToday) : null;
      const ownReleases = releases.filter((r) => r.artistId === a.id);
      const ownTours = tours.filter((t) => t.artistId === a.id);
      const ownMerch = merch.filter((m) => m.artistId === a.id);
      const releaseRevenue = ownReleases.reduce((s, r) => s + (releaseFinance[r.id]?.revenue || 0), 0);
      const releaseCosts = ownReleases.reduce((s, r) => s + (releaseFinance[r.id]?.costs || 0), 0);
      const tourRevenue = ownTours.reduce((s, t) => s + (Number(t.revenue) || 0), 0);
      const tourCosts = ownTours.reduce((s, t) => s + (Number(t.costs) || 0), 0);
      const merchRevenue = ownMerch.reduce((s, m) => s + (Number(m.revenue) || 0), 0);
      const revenue = releaseRevenue + tourRevenue + merchRevenue;
      const releaseProfit = releaseRevenue - releaseCosts;
      const profit = releaseProfit + tourRevenue - tourCosts;
      const copies = ownReleases.reduce((s, r) => s + (releaseFinance[r.id]?.copies || 0), 0);
      return {
        ...a, lastRelease: last, daysSince, revenue, copies,
        releasesCount: ownReleases.length, albumsCount: ownReleases.filter((r) => r.type === "Álbum").length,
        toursCount: ownTours.length, tourRevenue, tourCosts, merchCount: ownMerch.length, merchRevenue,
        releaseRevenue, releaseCosts, releaseProfit, profit,
      };
    });
  }, [artists, releases, releaseFinance, tours, merch, appToday]);

  const dueSoon = useMemo(
    () => artistStats.filter((a) => a.status !== "Retirado" && a.daysSince !== null && a.daysSince >= RELEASE_CADENCE_DAYS - 5)
      .sort((x, y) => (y.daysSince ?? 0) - (x.daysSince ?? 0)),
    [artistStats]
  );

  const recentActivity = useMemo(() => {
    const items = [
      ...releases.map((r) => ({ ts: r.createdAt, label: `Lanzamiento «${r.title}»`, sub: artistName(r.artistId) })),
      ...snapshots.map((s) => ({ ts: s.createdAt, label: `Actualización de ventas — semana ${s.week}`, sub: releaseTitle(s.releaseId) })),
      ...tours.map((t) => ({ ts: t.createdAt, label: `Gira «${t.tourName}»`, sub: artistName(t.artistId) })),
      ...merch.map((m) => ({ ts: m.createdAt, label: `Merch «${m.product}»`, sub: artistName(m.artistId) })),
      ...artists.map((a) => ({ ts: a.createdAt, label: "Alta de artista", sub: a.name })),
    ];
    return items.filter((i) => i.ts).sort((a, b) => b.ts - a.ts).slice(0, 8);
  }, [releases, snapshots, tours, merch, artists, artistName, releaseTitle]);

  const editionReminders = useMemo(() => {
    return releases
      .filter((r) => r.type === "Álbum")
      .filter((album) => isAnniversaryReminderDue(album, releases, appToday))
      .map((album) => ({ album }));
  }, [releases, appToday]);

  if (loading) {
    return (
      <div className="ltk-root">
        <div className="ltk-loading-screen">
          <span className="ltk-loading-dot" />
          <div>Conectando con la base de datos…</div>
        </div>
      </div>
    );
  }

  const exportData = () => {
    const payload = {
      app: "Studio Desk", exportedAt: new Date().toISOString(), appVersion: APP_VERSION,
      saveId: activeSaveId, saveName: activeSaveName || "",
      data: { artists, releases, snapshots, tours, merch, notes },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (activeSaveName || "partida").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    a.href = url;
    a.download = `studio-desk-${safeName || "partida"}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  return (
    <div className="ltk-root">
      <div className="ltk-shell">
        <Sidebar tab={tab} setTab={goToTab} counts={{ artists: artists.length, releases: releases.length, tours: tours.length, merch: merch.length, notes: notes.length }} activeSaveName={activeSaveName} onChangeSave={onChangeSave} onExport={exportData} />
        <main className="ltk-main">
          <SyncStatusBar />
          {dbErrors.length > 0 && <ErrorBanner errors={dbErrors} onClear={() => setDbErrors([])} />}
          {detail && detail.type === "artist" && (
            <ArtistDetail
              artist={artistStats.find((a) => a.id === detail.id)}
              releases={releases} snapshots={snapshots} tours={tours} merch={merch} releaseFinance={releaseFinance}
              notes={notes} notesCrud={notesCrud} appToday={appToday}
              onBack={() => goToTab("artists")} onOpenRelease={openRelease}
            />
          )}
          {detail && detail.type === "release" && (
            <ReleaseDetail
              release={releases.find((r) => r.id === detail.id)}
              releases={releases} snapshots={snapshots} snapshotsCrud={snapshotsCrud}
              tours={tours} merch={merch} releaseFinance={releaseFinance} artists={artists} artistName={artistName}
              appToday={appToday}
              onBack={() => { const rel = releases.find((r) => r.id === detail.id); openArtist(rel ? rel.artistId : null); }}
              onOpenRelease={openRelease}
            />
          )}
          {!detail && tab === "dashboard" && <Dashboard totals={totals} artistStats={artistStats} dueSoon={dueSoon} recentActivity={recentActivity} appToday={appToday} releases={releases} tours={tours} merch={merch} editionReminders={editionReminders} onOpenArtist={openArtist} onOpenRelease={openRelease} />}
          {!detail && tab === "artists" && <ArtistsTab artistStats={artistStats} artists={artists} crud={artistsCrud} appToday={appToday} onOpenArtist={openArtist} />}
          {!detail && tab === "releases" && <ReleasesTab artists={artists} releases={releases} crud={releasesCrud} releaseFinance={releaseFinance} artistName={artistName} appToday={appToday} onOpenArtist={openArtist} onOpenRelease={openRelease} />}
          {!detail && tab === "rankings" && <RankingsTab artists={artists} releases={releases} releaseFinance={releaseFinance} artistStats={artistStats} artistName={artistName} onOpenArtist={openArtist} onOpenRelease={openRelease} />}
          {!detail && tab === "compare" && <CompareTab releases={releases} snapshots={snapshots} releaseFinance={releaseFinance} artistStats={artistStats} artistName={artistName} onOpenRelease={openRelease} onOpenArtist={openArtist} />}
          {!detail && tab === "tours" && <ToursTab artists={artists} releases={releases} tours={tours} crud={toursCrud} artistName={artistName} appToday={appToday} onOpenArtist={openArtist} />}
          {!detail && tab === "merch" && <MerchTab artists={artists} releases={releases} merch={merch} crud={merchCrud} artistName={artistName} onOpenArtist={openArtist} />}
          {!detail && tab === "notes" && <NotesTab artists={artists} notes={notes} crud={notesCrud} artistName={artistName} onOpenArtist={openArtist} />}
        </main>
      </div>
    </div>
  );
}

function EditLockPanel() {
  const [unlocked, setUnlocked] = useState(isEditUnlocked());
  const [input, setInput] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [keyError, setKeyError] = useState("");

  // Una clave con símbolos raros (£, tildes, comillas curvas...) puede viajar
  // mal en la cabecera HTTP x-edit-key y hacer que el servidor la rechace de
  // forma confusa (un 500 en vez de un aviso claro) — así que se exige que
  // sea solo texto ASCII normal (letras, números y los símbolos básicos del
  // teclado en inglés).
  const isAsciiSafe = (s) => /^[\x20-\x7E]*$/.test(s);

  const unlock = () => {
    const trimmed = input.trim();
    if (!trimmed) return;
    if (!isAsciiSafe(trimmed)) {
      setKeyError("Esa clave tiene algún símbolo especial (tipo £, tildes, tipografía \"elegante\"...) que puede viajar mal en la conexión y provocar errores raros. Usa solo letras, números y símbolos básicos de teclado en inglés (- _ . ! ? etc).");
      return;
    }
    setKeyError("");
    try { localStorage.setItem("ltk_edit_key", trimmed); } catch (e) { console.error(e); }
    setTimeout(() => window.location.reload(), 60);
  };
  const lock = () => {
    try { localStorage.removeItem("ltk_edit_key"); } catch (e) { console.error(e); }
    setTimeout(() => window.location.reload(), 60);
  };

  if (unlocked) {
    return (
      <div className="ltk-editlock">
        <span className="ltk-tag ltk-tag-success">🔓 Edición activada aquí</span>
        <button className="ltk-btn-ghost" onClick={lock}>Bloquear</button>
      </div>
    );
  }
  return (
    <div className="ltk-editlock">
      <span className="ltk-tag">🔒 Solo lectura</span>
      {!showForm ? (
        <button className="ltk-btn-ghost" onClick={() => setShowForm(true)}>Desbloquear edición</button>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, width: "100%" }}>
          <div style={{ display: "flex", gap: 6, width: "100%" }}>
            <input type="password" value={input} onChange={(e) => { setInput(e.target.value); setKeyError(""); }} placeholder="Clave" onKeyDown={(e) => { if (e.key === "Enter") unlock(); }} style={{ flex: 1, minWidth: 0 }} />
            <button className="ltk-btn" onClick={unlock}>OK</button>
          </div>
          {keyError && <div className="ltk-error-banner" style={{ margin: 0, fontSize: 11.5 }}>{keyError}</div>}
        </div>
      )}
    </div>
  );
}

function Meter({ pct, overdue }) {
  const width = Math.min(100, Math.max(4, pct));
  const color = overdue ? "var(--danger)" : pct > 75 ? "var(--accent)" : "var(--success)";
  return <div className="ltk-meter"><div className="ltk-meter-fill" style={{ width: `${width}%`, background: color }} /></div>;
}

function SyncStatusBar() {
  const { queue, failed, status, total } = useSyncStatus();
  const [justSynced, setJustSynced] = useState(false);
  const prevLenRef = React.useRef(queue.length);
  useEffect(() => {
    if (prevLenRef.current > 0 && queue.length === 0) {
      setJustSynced(true);
      const t = setTimeout(() => setJustSynced(false), 3000);
      prevLenRef.current = queue.length;
      return () => clearTimeout(t);
    }
    prevLenRef.current = queue.length;
  }, [queue.length]);

  const pct = total > 0 ? Math.round(((total - queue.length) / total) * 100) : 0;

  return (
    <React.Fragment>
      {queue.length > 0 && (
        <div className="ltk-sync-banner">
          <span>{status === "syncing" ? "🔄" : "📥"}</span>
          <span>
            <strong>{queue.length}</strong> cambio{queue.length === 1 ? "" : "s"} guardado{queue.length === 1 ? "" : "s"} solo en este dispositivo
            {total > 1 ? ` (${pct}% subido a Supabase)` : ""} — {status === "syncing" ? "subiendo…" : "reintentando conexión con Supabase…"}
          </span>
        </div>
      )}
      {queue.length === 0 && justSynced && <div className="ltk-sync-banner is-ok">✓ Todo sincronizado con Supabase</div>}
      {failed.length > 0 && (
        <div className="ltk-error-banner">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, flexWrap: "wrap", gap: 8 }}>
            <div style={{ fontWeight: 600 }}>
              ⚠️ {failed.length} cambio{failed.length === 1 ? "" : "s"} sin poder subir tras varios intentos:
            </div>
            {failed.length > 1 && <button className="ltk-btn-ghost" onClick={retryAllFailed}>Reintentar todos</button>}
          </div>
          {failed.map((f) => (
            <div key={f.qid} style={{ marginBottom: 6, paddingBottom: 6, borderBottom: "1px solid var(--border)" }}>
              <div><strong>{f.table}:{f.op}</strong> {f.lastError ? `${f.lastError.label} ${f.lastError.message}` : "sin detalle"}</div>
              <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                <button className="ltk-btn-ghost" onClick={() => retryFailedItem(f.qid)}>Reintentar</button>
                <button className="ltk-btn-ghost" onClick={() => discardFailedItem(f.qid)}>Descartar (perder este cambio)</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </React.Fragment>
  );
}

function ErrorBanner({ errors, onClear }) {
  const [copied, setCopied] = useState(false);
  const diagnosticText = () => {
    const lines = errors.map((e) => `${e.time} ${e.label} ${e.message}`);
    return `${APP_VERSION}\n${lines.join("\n")}`;
  };
  const copyDiagnostic = async () => {
    try {
      await navigator.clipboard.writeText(diagnosticText());
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      console.error(e);
    }
  };
  return (
    <div className="ltk-error-banner">
      <div style={{ fontWeight: 600, marginBottom: 6 }}>No se pudo sincronizar con Supabase ({APP_VERSION}):</div>
      {errors.map((e) => (
        <div key={e.id} style={{ marginBottom: 3 }}>
          <span className="ltk-muted" style={{ fontFamily: "var(--font-mono)" }}>{e.time}</span> <strong>{e.label}</strong> {e.message}
        </div>
      ))}
      <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
        <button className="ltk-btn-ghost" onClick={copyDiagnostic}>{copied ? "✓ Copiado" : "Copiar diagnóstico"}</button>
        <button className="ltk-btn-ghost" onClick={onClear}>Descartar</button>
      </div>
    </div>
  );
}
